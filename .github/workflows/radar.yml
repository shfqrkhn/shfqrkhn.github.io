name: radar
# Weekly: look for new upstream resources and drift in what RepoRadar already tracks. Read-only; it only writes the report to the run summary.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python converge/radar_refresh.py --out radar-report.md
      - name: Show the report in the run summary
        run: cat radar-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep one tracking issue current (public repository names only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 radar-report.md > body.md
          n=$(gh issue list --state open --search "RepoRadar weekly report in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md; else gh issue create --title "RepoRadar weekly report" --body-file body.md; fi
