/* @@OMNEVUM-KIT-TOKENS@@ */
:root[data-app]{--acc:hsl(var(--hue,215) var(--app-s) var(--app-l));--on-acc:var(--app-on)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:var(--acc);color:var(--on-acc)}

button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:var(--s4);top:-60px;padding:var(--s2) var(--s4);background:var(--acc);color:var(--on-acc);border-radius:var(--r);z-index:60;text-decoration:none;font-weight:600}

.ib:hover{border-color:var(--acc)}.ib:active{transform:scale(.96)}.ib[hidden]{display:none}

:root{--f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--surface:var(--card);--ctl:color-mix(in srgb,var(--fg) 45%,var(--bg));--ink:var(--fg);--muted:var(--mut);--accent:var(--acc);--accent-ink:var(--on-acc);--focus:var(--acc);--bar-h:60px;--danger:#9B1C24;--success:#14532D;--warning:#7A5200;--f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
--t-s:1rem;--t-b:1rem;--t-m:1.375rem;--t-l:2.125rem;--t-xl:4.5rem;--r-c:12px;--r-k:16px;--nav:4rem;--rail:200px;
--raise:color-mix(in srgb,var(--ink) 7%,var(--surface));--rule:var(--line);--ease:cubic-bezier(.2,.7,.2,1);--sp-2:4px;--sp-3:4px;--sp-4:4px;--sp-6:8px;--sp-8:8px;--sp-10:12px;--sp-12:12px;--sp-14:16px;--sp-16:16px;--sp-18:20px;--sp-20:20px;--sp-24:24px;--sp-32:32px;--sp-48:48px;--rd-1:1px;--rd-2:2px;--rd-6:6px;--sz-2:2px;--sz-6:6px;--sz-8:8px;--sz-12:12px;--sz-14:14px;--sz-18:18px;--sz-22:22px;--sz-24:24px;--sz-26:26px;--sz-28:28px;--sz-32:32px;--sz-36:36px;--sz-44:44px;--sz-48:48px;--sz-52:52px;--sz-56:56px;--sz-64:64px;--sz-72:72px;--sz-76:76px;--sz-88:88px;--sz-96:96px;--sz-112:112px;--bw:1px;--t-num:1.625rem;--print-paper:#fff;--print-ink:#000;--print-note-rule:#555;--print-note-bg:#f3f3f3;--print-strong:#222;--print-rule:#777;--print-chip:#eee;--print-muted:#444;--print-faint:#999;--print-aaa:#aaa}
html[data-theme="charcoal"],html[data-theme="black"]{--danger:#F2A5AB;--success:#7CCB9B;--warning:#E3B341}
button,a,input,select,textarea,summary{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t-b)/1.5 var(--f-body);min-height:100dvh;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink);text-underline-offset:.2em}
h1,h2,h3{font-weight:700;line-height:1.2;text-wrap:balance}
p{text-wrap:pretty;max-width:68ch}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0}
/* frame */
html{scroll-padding-top:8rem;scroll-padding-bottom:calc(var(--dock) + var(--timer-h) + var(--sp-24))}
#main{min-height:60dvh}
body:not(.ready) .foot,body:not(.ready) #plate-math{visibility:hidden}
.app{max-width:760px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--nav) + var(--sp-32) + env(safe-area-inset-bottom))}
.top{position:sticky;top:var(--bar-h);z-index:20;background:var(--bg);padding:var(--sp-10) var(--sp-16) var(--sp-8);border-bottom:var(--bw) solid var(--rule)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-12)}
.brand h1{margin:0;font-size:var(--t-m)}
.brand small{display:block;color:var(--muted);font-size:var(--t-s);line-height:1.3}
#save-state{font-size:var(--t-s);color:var(--muted);text-align:right;font-weight:400}
#save-state.warntxt{color:var(--warning)}#save-state.badtxt{color:var(--danger)}
.view{padding:var(--sp-16) var(--sp-16) var(--sp-24)}
.stack{display:grid;gap:var(--sp-16)}
.card{padding:var(--sp-16)}
.card h2,.card h3,.card p{margin-top:0}
.card h2{font-size:var(--t-m);margin-bottom:var(--sp-8)}
.muted{color:var(--muted)}
.tiny{font-size:var(--t-s)}
.caps{font-size:var(--t-s);font-weight:700;color:var(--muted)}
.row{display:flex;gap:var(--sp-8);align-items:center}
.spread{display:flex;gap:var(--sp-12);align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}
.hidden{display:none!important}
.goodtxt{color:var(--success)}.warntxt{color:var(--warning)}.badtxt{color:var(--danger)}
/* controls */
.btn,button.pill{min-height:var(--sz-48);padding:0 var(--sp-16);border:var(--bw) solid var(--ctl);background:var(--surface);color:var(--ink);border-radius:var(--r-c);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-8);text-align:center;transition:background-color .12s var(--ease),transform .12s var(--ease)}
.btn:hover,button.pill:hover{background:var(--raise)}
.btn:active,.step:active,.check:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

function prToast(id,i){const d=db.draft,e=d?.exercises.find(x=>x.id===id),z=e?.sets?.[i];if(!e||!z||e.skipped||['assistance','bodyweight','legacy-unknown'].includes(e.loadMode)||resolveExercise(id,'',d.planVersion).def?.trackProgress===false)return;const pts=seriesData(e.variant,e.loadMode);if(!pts.length)return;const l=Number(z.load)||0;if(l>Math.max(...pts.map(p=>p.v)))toast('Load record for '+e.variant+': '+l+' '+unit());else{const me=Math.max(0,...pts.map(p=>p.e1||0)),ce=epley(z.load,z.reps)||0;if(me>0&&ce>me)toast('Estimated 1RM record for '+e.variant+': '+ce+' '+unit())}}
function lineSvg(pts,suffix,aria,zero=true){const w=700,h=200,p=28,vs=pts.map(x=>x.v),lo=zero?Math.min(...vs,0):Math.min(...vs),hi=Math.max(...vs,zero?1:lo+1),dx=pts.length===1?0:(w-2*p)/(pts.length-1),y=v=>h-p-(v-lo)/(hi-lo||1)*(h-2*p),xy=pts.map((x,i)=>`${p+i*dx},${y(x.v)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(aria)}"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}"/><polyline points="${xy}"/>${pts.map((x,i)=>`<circle cx="${p+i*dx}" cy="${y(x.v)}" r="4"><title>${esc(x.t)}: ${x.v} ${esc(suffix)}</title></circle>`).join('')}<text x="4" y="${p+4}">${hi} ${esc(suffix)}</text><text x="4" y="${h-p}">${lo}</text></svg>`}
function sideHtml(){let variant='',mode='total';try{const d=db.draft;if(d){const cur=deriveWorkoutState(d).current,f=cur?cur.e:d.exercises.find(x=>!x.skipped);if(f){variant=f.variant;mode=f.loadMode}}else{variant=PLAN[nextWorkout()].pairs[0].ex[0].name;mode=loadModeFor(variant)}}catch(_){variant=''}

/* warm-up ramp: the app's own convention, no published source */
function warmupRamp(work){const w=Number(work);if(!(w>0))return[];const step=plateStep(),out=[];for(const [pct,reps] of [[40,8],[60,5],[80,3]]){const l=roundTo(w*pct/100,step);if(l>0&&l<w&&!out.some(x=>x.load===l))out.push({pct,load:l,reps})}return out}

async function fillPrimer(id){if(!await flushDraftSave())return;const e=db.draft?.exercises.find(x=>x.id===id);if(!e||e.primer.done)return;const r=warmupRamp(e.sets[0].load);if(!r.length){toast('Enter the first working load first');return}const t=r[r.length-1];await commitChange(c=>{const p=c.draft.exercises.find(x=>x.id===id).primer;p.load=t.load;p.reps=t.reps;syncSetLoad(p)})}

function flexxProblem(s){if(!s||typeof s!=='object'||Array.isArray(s))return 'not an object';for(const f of ['id','date','recoveryStatus','exercises'])if(!(f in s))return 'missing '+f;if(typeof s.id!=='string'||!FLEXX_UUID.test(s.id))return 'bad id';if(typeof s.date!=='string'||s.date.length>64||!Number.isFinite(Date.parse(s.date)))return 'bad date';if(!FLEXX_RECOVERY.includes(s.recoveryStatus))return 'bad recovery status';if(!Array.isArray(s.exercises)||s.exercises.length>20)return 'bad exercise list';for(const e of s.exercises){if(!e||typeof e!=='object'||Array.isArray(e))return 'bad exercise';if(typeof e.id!=='string'||!safeId(e.id,40))return 'bad exercise id';if(typeof e.name!=='string'||e.name.length>80)return 'bad exercise name';if(typeof e.weight!=='number'||!Number.isFinite(e.weight)||e.weight<0||e.weight>2000)return 'weight outside 0 to 2000 lb';if(e.setsCompleted!==undefined&&(!Number.isInteger(e.setsCompleted)||e.setsCompleted<0||e.setsCompleted>20))return 'bad sets count';for(const b of ['completed','usingAlternative','skipped'])if(e[b]!==undefined&&typeof e[b]!=='boolean')return 'bad '+b;if(e.altName!==undefined&&e.altName!==null&&(typeof e.altName!=='string'||e.altName.length>80))return 'bad alternative name'}return ''}
function normFlexx(s){return{id:s.id,date:new Date(s.date).toISOString(),recovery:s.recoveryStatus,exercises:s.exercises.map(e=>{const alt=!!(e.usingAlternative&&e.altName),sets=e.setsCompleted!==undefined?e.setsCompleted:(e.completed?3:0);return{id:e.id,name:String(alt?e.altName:e.name).slice(0,80),loadKg:Math.round(e.weight*0.45359237*1000)/1000,sets,reps:FLEXX_REPS[e.id]??null,completed:!!e.completed,skipped:!!e.skipped,alt}})}}
function parseFlexx(text){let x;try{x=JSON.parse(text)}catch(_){throw new Error('The file is not valid JSON')}if(hasUnsafeKey(x))throw new Error('The file contains unsafe keys and was refused');const list=Array.isArray(x)?x:(x&&typeof x==='object'?x.sessions:null);if(!Array.isArray(list))throw new Error('This is not a Flexx Files export: it has no sessions list');if(!list.length)throw new Error('The export contains no sessions');if(list.length>5000)throw new Error('The export has more than 5000 sessions');const bad=[],ids=new Set();list.forEach((s,i)=>{const p=flexxProblem(s);if(p)bad.push(`session ${i+1}: ${p}`);else if(ids.has(s.id))bad.push(`session ${i+1}: repeated id`);else ids.add(s.id)});if(bad.length)throw new Error('Nothing was imported. '+bad.slice(0,3).join('; ')+(bad.length>3?` (and ${bad.length-3} more)`:''));return list.map(normFlexx).sort((a,b)=>a.date.localeCompare(b.date))}
async function previewFlexx(file){if(!file)return;if(file.size>10*1024*1024)return toast('Import rejected: file too large');try{const sessions=parseFlexx(await file.text()),have=new Set((db.flexx||[]).map(s=>s.id)),fresh=sessions.filter(s=>!have.has(s.id));if((db.flexx||[]).length+fresh.length>5000)throw new Error('The combined Flexx history would exceed 5000 sessions');pendingFlexx={fresh};const lifts=fresh.reduce((a,s)=>a+s.exercises.filter(e=>!e.skipped).length,0),c=document.getElementById('modal-content');c.innerHTML=`<h2>Import Flexx Files data</h2><p>${sessions.length} session(s) in the file: ${fresh.length} new, ${sessions.length-fresh.length} already imported.</p>${fresh.length?`<p>New sessions run from ${esc(formatCivilDate({date:fresh[0].date}))} to ${esc(formatCivilDate({date:fresh[fresh.length-1].date}))}, with ${lifts} lift record(s).</p>`:''}<p>Flexx files do not record reps. Each lift is shown with reps assumed from its plan slot (for example 3 x 8), and any estimated 1RM from an import is marked reps assumed.</p><p class="muted tiny">Flexx records weights in pounds; they are stored in kilograms and shown in your unit. Warm-up, cardio and decompression checklists, session and week numbers and volume totals are not carried over. Imported sessions appear in History and in each lift's chart; they do not change your workouts or suggested loads. Nothing is saved until you choose Import. A copy of your current data is kept so you can restore it.</p><div class="modal-actions"><button class="btn primary" type="button" data-action="flexx-apply" ${fresh.length?'':'disabled'}>Import ${fresh.length} session(s)</button><button class="btn" type="button" data-action="close-modal">Cancel</button></div>`;activateModal()}catch(e){pendingFlexx=null;toast('Import rejected: '+(e instanceof SyntaxError?'This file is not valid JSON.':e.message))}}
async function applyFlexx(){const p=pendingFlexx;pendingFlexx=null;if(!p||!p.fresh.length)return;closeModal();const now=new Date().toISOString();try{const have=new Set((db.flexx||[]).map(s=>s.id)),fresh=p.fresh.filter(s=>!have.has(s.id)),before=rollbackData(db);const ok=await commitChange(c=>{c.flexx=[...(c.flexx||[]),...fresh.map(s=>({...s,importedAt:now}))].sort((a,b)=>a.date.localeCompare(b.date));c.recovery=c.recovery||{};c.recovery.preImport={savedAt:now,data:before}});toast(ok?`Imported ${fresh.length} Flexx session(s)`:'Import was not saved')}catch(e){toast('Import failed. Nothing changed')}}
function flexxRemove(){if(!(db.flexx||[]).length){toast('No Flexx sessions are stored');return}confirmModal('Remove imported Flexx sessions?','All imported Flexx Files sessions are removed from this browser. Your own workouts are not touched. A copy of the current data is kept so you can restore it.',async()=>{closeModal();const now=new Date().toISOString(),before=rollbackData(db);await commitChange(c=>{c.flexx=[];c.recovery=c.recovery||{};c.recovery.preImport={savedAt:now,data:before}});toast('Imported Flexx sessions removed')})}
function flexxLogHtml(){const l=[...(db.flexx||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));if(!l.length)return '';const shown=l.slice(0,flexxLimit);return `<div class="card"><h2>Imported from Flexx Files</h2><p class="muted tiny">${l.length} imported session(s). Read only: weights shown in ${unit()}. Flexx files do not record reps, so each lift shows reps assumed from its plan slot.</p><div class="log">${shown.map(s=>`<details class="log-item"><summary><strong>${esc(formatCivilDate({date:s.date}))}</strong> <span class="pill">${esc(s.recovery)}</span><div class="tiny muted">${s.exercises.filter(e=>!e.skipped).length} lifts</div></summary><div class="log-grid"><strong>Lift</strong><strong>Load</strong><strong>Sets</strong><strong>Done</strong>${s.exercises.map(e=>`<span>${esc(e.name)}${e.alt?' (alternative)':''}</span><span>${e.skipped?'skipped':esc(displayLoadFromKg(e.loadKg)+' '+unit())}</span><span>${e.skipped?'-':esc(e.sets+(e.reps?' x '+e.reps+' (reps assumed)':''))}</span><span>${e.completed?'yes':'no'}</span>`).join('')}</div></details>`).join('')}</div>${shown.length<l.length?`<button class="btn" type="button" data-action="flexx-more">Show more imported sessions (${shown.length}/${l.length})</button>`:''}</div>`}

function helpExtraHtml(){return `<h3>Progression programs</h3><p>Settings and data has a Progression program choice: the default rule, linear progression, double progression, or a 5/3/1 four-week wave. Each shows its rule with the numbers it uses, and you can edit the numbers. Stall, deload and gap rules are stated there as rules. Suggested loads are prefilled into the next session; change them freely.</p><p class="tiny muted">Sources. Linear progression, the stall rule (3 sessions to 90%), the deload rule (every 6th week to 60%) and the gap rule (7 days) follow the rules in the code of Flexx Files 3.10.1, the app this one replaces. Double progression follows its common published description (keep the load until all sets reach the top of the rep range, then add load and restart at the bottom), for example the Legion Athletics and Alpha Progression glossary pages; those are web articles, not trials, and this description is still checked only against secondary pages. The nearest primary source found is the American College of Sports Medicine position stand, Progression models in resistance training for healthy adults (Med Sci Sports Exerc 2009; 41(3): 687-708, doi:10.1249/MSS.0b013e3181915670, PubMed 19204579, retrieved 2026-10-31), which recommends a 2 to 10 percent load increase once the lifter can do one or two repetitions over the target; it does not describe the rep-first scheme by name. The 5/3/1 wave follows the published 5/3/1 method (a book, 2009): percentages of a training max in four weeks. The book was not read for this app; the percentages were checked against two public summaries (The Fitness Wiki 5/3/1 primer and a calculator page). One summary says the method's author no longer uses the fixed deload week, and the 10% reset figure is unverified; both are editable. The method's own site (The Training Max: What You Need to Know, retrieved 2026-10-31) says the training max can be adjusted to fit current programming and goals and mentions starting at 90%, but it does not state a 10 percent reduction after a stall, so that figure stays unverified.</p><h3>Estimated one-rep max</h3><p>Estimated 1RM = load x (1 + reps / 30), the widely used 1RM estimate formula (from a 1985 training chart, not a journal article, and the original was not read). The formula as written here is stated in a peer-reviewed protocol that cites that chart (BMJ Open 2019; 9(11): e031159, doi:10.1136/bmjopen-2019-031159, retrieved 2026-10-31); a PubMed Central study (PMC4042664, retrieved 2026-10-31) describes the chart as not based on scientific research. It is shown only for sets of 1 to 12 reps and is an estimate that can differ from a true max by 10% or more.</p><h3>Reps in reserve</h3><p>Tap a number for how many more good reps you could have done. Tap it again to clear. The scale follows a published paper, Novel resistance training-specific rating of perceived exertion scale measuring repetitions in reserve, Journal of Strength and Conditioning Research 2016; 30(1): 267-275, doi:10.1519/JSC.0000000000001049 (PubMed, retrieved 2026-10-31).</p><h3>Warm-up ramp and records</h3><p>The warm-up ramp is this app's own convention, not from a published source. A load record or an estimated 1RM record is flagged when a set beats every earlier completed set of that variation.</p><h3>Body weight</h3><p>The Progress screen has a body weight log. It stores what you type and draws no conclusion.</p><h3>Flexx Files data</h3><p>In Settings and data, Import Flexx backup reads a Flexx Files backup file, checks it, and shows a preview before anything is saved. Imported sessions appear in History and in lift charts. Export backup includes them; Remove imported sessions deletes them.</p>`}
function newSet(load='',reps=''){const z={load,reps,done:false,loggedAt:null,enteredLoad:load===''?'':Number(load),enteredUnit:unit(),loadKg:canonicalLoadKg(load)};return z}
function newDraft(w){const p=PLAN[w],now=new Date().toISOString();return{id:newId('s'),planVersion:APP.planVersion,date:now,civilDate:localCivilDate(),timeZone:currentTimeZone(),workout:w,status:'draft',started:now,ended:null,createdAt:now,updatedAt:now,notes:'',timing:{activeMs:0,runningSince:now,paused:false},exercises:[...p.pairs.flatMap(x=>x.ex),p.core].map(e=>{const g=progression(e.id,e.name),L=i=>g.loads?g.loads[i]:g.load,R=i=>g.reps?.[i]??'';return{id:e.id,name:e.name,variant:e.name,loadMode:loadModeFor(e.name),rir:null,skipped:false,primer:g.primer?newSet(g.primer.load,g.primer.reps):newSet(''),sets:[newSet(L(0),R(0)),newSet(L(1),R(1))]}})} }
function ensureTiming(s){if(!s.timing)s.timing={activeMs:0,runningSince:s.started||new Date().toISOString(),paused:false};return s.timing}
function activeMillis(s,now=Date.now()){const t=s?.timing;if(!t)return 0;let ms=Math.max(0,Number(t.activeMs)||0);if(!t.paused&&t.runningSince){const a=Date.parse(t.runningSince);if(Number.isFinite(a))ms+=Math.max(0,now-a)}return ms}

function pauseRestoredDraftAt(data,cutoff=''){const d=data?.draft,t=d?.timing;if(!d||!t||t.paused||!t.runningSince)return false;const evidence=cutoff||lastLoggedAt(d)||d.updatedAt||d.createdAt||d.started||'',cut=Date.parse(evidence),start=Date.parse(t.runningSince);if(Number.isFinite(cut)&&Number.isFinite(start)&&cut>=start)t.activeMs=Math.max(0,Number(t.activeMs)||0)+(cut-start);t.runningSince=null;t.paused=true;return true}

function healthCheck(){const healthy=!storageFault&&validateDB(db),c=document.getElementById('modal-content');c.innerHTML=`<div class="caps">System health</div><h2>${healthy?'Healthy':'Action required'}</h2><div class="stack"><div class="spread"><div><strong>Your saved record</strong><div class="tiny muted">${storageFault?esc(storageFault.reason):validateDB(db)?'Readable and complete':'Problem found'}</div></div><span class="pill ${healthy?'goodtxt':'badtxt'}">${healthy?'OK':'FAIL'}</span></div><div class="spread"><div><strong>Where it is kept</strong><div class="tiny muted">${storageMode==='IndexedDB'?'In this browser':storageMode==='nonpersistent'?'Not being saved':'In a basic fallback store'}</div></div><span class="pill">INFO</span></div><div class="spread"><div><strong>Backup file</strong><div class="tiny muted">${hasCurrentVerifiedBackup()?'Your last checked backup file matches your data':'No up to date backup file checked yet'}</div></div><span class="pill ${hasCurrentVerifiedBackup()?'goodtxt':'warntxt'}">${hasCurrentVerifiedBackup()?'OK':'CHECK'}</span></div></div><button class="btn" data-action="close-modal">Close</button>`;activateModal()}

function downloadRawCanonical(){if(storageFault?.raw===null||storageFault?.raw===undefined)return toast('No preserved invalid canonical record is available');const raw=typeof storageFault.raw==='string'?storageFault.raw:JSON.stringify(storageFault.raw,null,2);downloadBlob(raw,'application/json','gainzgoblin-invalid-canonical-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json')}
async function resetAll(){if(!repo&&storageFault)return toast('This datastore requires a newer compatible application version or browser site-data controls');confirmModal('Erase all local data?','This removes the new canonical FlexxFiles data from this browser. Legacy v1 data is left untouched unless cleaned separately.',async()=>{if(pendingConflict)return toast('Resolve concurrent changes before erasing data');if(storageMode==='nonpersistent'){closeModal();clearTimeout(draftSaveTimer);draftDirty=false;db=DEFAULT();observedRevision=0;stopTimer();renderAll(false);return}if(!storageFault&&!await flushDraftSave())return;closeModal();const ok=await persistCandidate(DEFAULT(),observedRevision,{allowRecovery:true});if(ok){clearTimeout(draftSaveTimer);stopTimer();renderAll(false);toast('All current app data erased')}},'ERASE')}
function embeddedIdentity(){return{version:document.querySelector('meta[name="strength-tracker-version"]')?.content||'',build:document.querySelector('meta[name="strength-tracker-build"]')?.content||'',schema:Number(document.querySelector('meta[name="strength-tracker-schema"]')?.content)}}
function embeddedIdentityMatches(){const x=embeddedIdentity();return x.version===APP.version&&x.build===APP.build&&x.schema===APP.schema}
function showHelp(){const c=document.getElementById('modal-content');c.innerHTML=`<h2>Help</h2><ol><li><strong>Log.</strong> Set load and reps with + and -, then tap Complete set. Rest timer runs after each pair.</li><li><strong>Back up.</strong> More, then Backup & verify. Export saves a file, Verify checks it. Files are not encrypted.</li><li><strong>Your data</strong> stays in this browser. Clearing site data or switching browser removes it. Export now and then.</li><li><strong>Delete.</strong> Remove one workout in History. Erase all data is in Settings.</li><li><strong>Plan.</strong> Fixed: Workout A and B. Tap Swap exercise for listed substitutes. Version ${esc(CONTENT.dataVersion)}, ${esc(CONTENT.date)}.</li></ol><details class="secondary"><summary>Edit plan and more</summary><ol><li>Open this file in a plain text editor. Keep a spare copy.</li><li>Search for <code>&quot;dataVersion&quot;</code>. The block below it lists every exercise: name, reps, cue, substitutes.</li><li>Rename: search <code>&quot;name&quot;: &quot;Leg Press&quot;</code> and change the second quoted text. Do not change ids (they link your history), the Content-Security-Policy line, or code outside that block.</li><li>Colour: search <code>--brand-light&#58;</code> and <code>--brand-dark&#58;</code>, change the six characters after #.</li><li>Blank page: undo your last edit. A missing quote or comma is the usual cause.</li><li>To update the app, replace the file. Saved data stays. A backup from a newer version is refused.</li></ol><p class="tiny muted">Old workouts keep their old names. Names with "DB ", "Assisted", "Push-Up", "Plank" or "Dead Bug" change how loads count.</p><h3>Update check</h3><p>Opened from a web address, the app re-fetches its own page to compare versions: at start, on tab return, and on Check for update. Nothing you logged is sent. As a file, no request is made.</p>${helpExtraHtml()}</details><div class="modal-actions"><button class="btn primary" data-action="close-modal">Close</button></div>`;activateModal()}
function showLicences(){const c=document.getElementById('modal-content'),src=document.getElementById('licences-src');c.innerHTML=`<h2>Licences</h2><p class="muted">Two embedded fonts.</p><div class="licence-text" tabindex="0" role="region" aria-label="Font licence text"></div><div class="modal-actions"><button class="btn primary" data-action="close-modal">Close licences</button></div>`;c.querySelector('.licence-text').textContent=src?src.content.textContent:'Licence text unavailable';activateModal()}
function updateStatusText(){if(!updateState.supported)return'Update checking unavailable outside HTTP(S) hosting';if(updateState.status==='available')return`Version ${updateState.remoteVersion} available`;if(updateState.status==='current')return`Running current deployed version ${APP.version}`;if(updateState.status==='offline')return'Offline; update check deferred';if(updateState.status==='error')return`Update check unavailable: ${updateState.error}`;return`Running ${APP.version}; deployment not checked yet`}
async function checkUpdate(force=false){if(!updateState.supported)return;if(!navigator.onLine){updateState.status='offline';renderAll(false);return}if(!force&&Date.now()-updateState.lastChecked<15*60*1000)return;try{const u=new URL(location.href);u.hash='';u.searchParams.set('_st_check',Date.now());const r=await fetch(u.href,{cache:'no-store',credentials:'same-origin',redirect:'error'});if(!r.ok)throw new Error('HTTP '+r.status);const doc=new DOMParser().parseFromString(await r.text(),'text/html'),v=doc.querySelector('meta[name="strength-tracker-version"]')?.content||'',b=doc.querySelector('meta[name="strength-tracker-build"]')?.content||'',s=Number(doc.querySelector('meta[name="strength-tracker-schema"]')?.content);if(!v||!b||!Number.isInteger(s))throw new Error('Deployment identity unreadable');const cmp=compareVersions(v,APP.version);if(cmp>0){if(s<APP.schema)throw new Error('Newer app has older data schema');updateState.status='available'}else if(cmp<0)throw new Error('Deployment rollback detected');else if(b!==APP.build||s!==APP.schema)throw new Error('Same-version build/schema mismatch');else updateState.status='current';updateState.remoteVersion=v;updateState.remoteBuild=b;updateState.remoteSchema=s;updateState.error='';updateState.lastChecked=Date.now()}catch(e){updateState.status='error';updateState.error=e.message;updateState.lastChecked=Date.now()}renderUpdateBanner();if(currentView==='data'){const ae=document.activeElement,aid=ae&&ae.id;renderData();if(aid&&aid!=='main'){const n=document.getElementById(aid);if(n&&n!==document.activeElement)n.focus({preventScroll:true})}}}
function updateSafeToReload(){return !db.draft&&!draftDirty&&!pendingConflict&&!storageFault&&!(Number.isInteger(updateState.remoteSchema)&&updateState.remoteSchema>APP.schema&&!hasCurrentVerifiedBackup())}
function renderUpdateBanner(){const el=document.getElementById('update-banner');if(!el)return;if(updateState.status!=='available'||updateState.dismissedVersion===updateState.remoteVersion){el.classList.remove('show');el.innerHTML='';return}const schemaBackup=Number.isInteger(updateState.remoteSchema)&&updateState.remoteSchema>APP.schema&&!hasCurrentVerifiedBackup(),blocked=!updateSafeToReload(),msg=storageFault?'Fix the saved-record problem before reloading.':schemaBackup?'This update changes the data schema. Verify a current external backup before reloading.':blocked?'Finish or save active work before reloading.':'A newer deployed single-file release is ready.';el.innerHTML=`<div class="update-copy"><strong>Update ${esc(updateState.remoteVersion)} available</strong><span class="tiny muted">${esc(msg)}</span></div><div class="row"><button class="btn small primary" data-action="reload-update" ${blocked?'disabled':''}>Reload update</button><button class="btn small ghost" data-action="dismiss-update">Later</button></div>`;el.classList.add('show')}
async function handleAction(el){const a=el.dataset.action,id=el.dataset.id;if(a==='show-view'){closeModal();showView(el.dataset.view)}else if(a==='show-backup'){closeModal();showView('data',false);focusBackup()}else if(a==='start-workout')await startWorkout();else if(a==='toggle-set')await toggleSet(id,Number(el.dataset.index));else if(a==='toggle-primer')await togglePrimer(id);else if(a==='toggle-skip')await toggleSkip(id);else if(a==='undo')await undoLastSet();else if(a==='copy-prev')await copyPrev(id,Number(el.dataset.index));else if(a==='legacy-mode')await confirmLegacyMode(id,el.dataset.value);else if(a==='toggle-clock')await toggleClock();else if(a==='finish')await finishSession(el.dataset.status);else if(a==='discard-draft')await discardDraft();else if(a==='reopen')await reopenSession(id);else if(a==='delete-session')await deleteSession(id);else if(a==='restore-deleted')await restoreDeleted();else if(a==='restore-preimport')await restorePreImport();else if(a==='start-timer')startTimer(Number(el.dataset.seconds),el.dataset.label);else if(a==='timer-pause')toggleTimerPause();else if(a==='timer-add')addTimer(el.dataset.delta);else if(a==='timer-reset')resetTimer();else if(a==='timer-stop')stopTimer();else if(a==='form-search'){const e=db.draft?.exercises.find(x=>x.id===id);if(e)openExternal(formSearchUrl(e.variant))}else if(a==='form-search-name')openExternal(formSearchUrl(el.dataset.name));else if(a==='snapshot')await showSnapshot(id||'');else if(a==='snapshot-clean')snapshotClean();else if(a==='snapshot-json')snapshotJson();else if(a==='snapshot-print')snapshotPrint();else if(a==='close-modal')closeModal();else if(a==='export-backup')await exportBackup();else if(a==='export-csv')exportCSV();else if(a==='persist-storage')await requestPersistentStorage();else if(a==='health')healthCheck();else if(a==='download-diag')downloadDiagnostics();else if(a==='download-raw-canonical')downloadRawCanonical();else if(a==='reset-all')await resetAll();else if(a==='print-plan')window.print();else if(a==='check-update'){if(!updateState.supported){toast('Update check works only when the app is opened from a web address');return}await checkUpdate(true);toast(({current:'You have the latest version',available:'Update '+updateState.remoteVersion+' is available',offline:'You are offline, so the update check was skipped',error:'Update check failed: '+updateState.error})[updateState.status]||'Update check finished')}else if(a==='reload-update'){if(updateSafeToReload())location.reload()}else if(a==='dismiss-update'){updateState.dismissedVersion=updateState.remoteVersion;renderUpdateBanner()}else if(a==='log-more'){logLimit=Math.min(db.sessions.length,logLimit+50);renderLog()}else if(a==='confirm-yes'){const pc=pendingConfirm;if(!pc)return;if(pc.word&&document.getElementById('confirm-word')?.value!==pc.word){toast('Confirmation text does not match');return}pendingConfirm=null;await pc.onYes()}else if(a==='legacy-choice'){const lr=legacyRecoveryOptions,i=Number(el.dataset.index);if(!lr||!lr.options[i])return;legacyRecoveryOptions=null;delete document.getElementById('modal').dataset.locked;closeModal(true);lr.resolve(lr.options[i])}else if(a==='conflict-keep')await resolveConflict(true);else if(a==='conflict-load')await resolveConflict(false);else if(a==='show-help')showHelp();else if(a==='show-licences')showLicences();else if(a==='step')stepSet(el);else if(a==='set-rir')await setRir(id,Number(el.dataset.value));else if(a==='fill-primer')await fillPrimer(id);else if(a==='bw-add')await bwAdd();else if(a==='bw-del')await bwDel(id);else if(a==='flexx-apply')await applyFlexx();else if(a==='flexx-remove')flexxRemove();else if(a==='flexx-more'){flexxLimit+=20;renderLog()}else if(a==='tm-suggest')await setProgramTm(id,el.dataset.value);else if(a==='tm-reset')await tmReset(id)}
document.addEventListener('click',e=>{const modal=document.getElementById('modal');if(modal?.classList.contains('snapshot-clean')&&e.target.closest('#snapshot-card')){e.preventDefault();snapshotClean();return}const el=e.target.closest('[data-action]');if(el){e.preventDefault();handleAction(el).catch(err=>{recordDiagnostic('action-error',err.message);toast('Action failed')})}});
document.addEventListener('input',e=>{if(e.target.dataset.input)stageInput(e.target)});
document.addEventListener('change',e=>{if(e.target.id==='verify-file'){verifyBackupFile(e.target.files[0]);e.target.value='';return}if(e.target.id==='import-file'){importBackup(e.target.files[0]);e.target.value='';return}if(e.target.id==='flexx-file'){previewFlexx(e.target.files[0]);e.target.value='';return}handleChange(e.target).catch(err=>{recordDiagnostic('change-error',err.message);toast('Change failed')})});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();dismissToast()}else{if(e.key==='Enter'&&!e.isComposing&&!e.shiftKey){const el=e.target;if(el&&el.matches&&el.matches('input[data-input="set-reps"]')&&!document.getElementById('modal').classList.contains('show')){const se=db.draft?.exercises.find(x=>x.id===el.dataset.id);if(se&&se.sets[Number(el.dataset.index)]&&!se.sets[Number(el.dataset.index)].done){e.preventDefault();toggleSet(el.dataset.id,Number(el.dataset.index)).then(focusFirstField);return}}}trapModalFocus(e)}});
document.getElementById('toast').addEventListener('click',dismissToast);
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushDraftSave();else{syncWakeLock();checkUpdate(false)}});window.addEventListener('pagehide',()=>flushDraftSave());window.addEventListener('online',()=>checkUpdate(true));window.addEventListener('error',e=>recordDiagnostic('runtime-error',e.message||'Runtime error'));window.addEventListener('unhandledrejection',e=>recordDiagnostic('unhandled-rejection',String(e.reason?.message||e.reason||'Unhandled rejection')));
function syncNavHeight(){const n=document.querySelector('.nav-inner'),r=document.documentElement;if(!n)return;if(window.innerWidth>=900)r.style.removeProperty('--nav');else r.style.setProperty('--nav',n.offsetHeight+'px')}
try{new ResizeObserver(syncNavHeight).observe(document.querySelector('.nav-inner'))}catch(_){}
window.addEventListener('resize',syncNavHeight);
setTimeout(()=>document.body.classList.add('ready'),2500);
(async function boot(){try{if(!embeddedIdentityMatches())recordDiagnostic('identity-mismatch','Embedded application identity mismatch');await bootstrapRepo();applyTheme();updateState.supported=location.protocol==='http:'||location.protocol==='https:';renderAll(false);document.body.classList.add('ready');if(storageFault){setSaveState('Recovery required','bad');showView('data',false)}else setSaveState(storageMode==='IndexedDB'?'Saved locally':storageMode==='nonpersistent'?'Not persistent':'Saved - fallback',storageMode==='IndexedDB'?'':storageMode==='nonpersistent'?'bad':'warn');setTimeout(()=>checkUpdate(false),1200);setInterval(updateWorkoutClocks,1000)}catch(e){recordDiagnostic('boot-failure',e.message);storageMode='nonpersistent';db=DEFAULT();observedRevision=0;applyTheme();renderAll(false);setSaveState('Storage recovery required','bad');toast('Persistent data could not be opened; running without persistence')}})();
</script>
</body></html>
