dship is not something you get, but something you create through your own virtuous and prosocial behaviors."}],"will_and_resilience":[{"day":149,"quote":"Difficulties strengthen the mind, as labor does the body.","author":"Seneca","explanation":"This is the principle of psychological conditioning: challenges are not just obstacles; they are the very things that build your mental and emotional resilience."},{"day":150,"quote":"He who is brave is free.","author":"Seneca","explanation":"Courage, the ability to act in the face of fear, liberates you from the prison of avoidance and inaction."},{"day":151,"quote":"A gem cannot be polished without friction, nor a man perfected without trials.","author":"Seneca","explanation":"Adversity is necessary for post-traumatic growth and the development of a strong, resilient character."},{"day":152,"quote":"It is a rough road that leads to the heights of greatness.","author":"Seneca","explanation":"Significant achievements and a strong character are forged through struggle, not ease."},{"day":153,"quote":"The art of living is more like wrestling than dancing.","author":"Marcus Aurelius","explanation":"Life requires you to be prepared for unexpected challenges and to grapple with reality, not just to follow a set choreography."},{"day":154,"quote":"The man who has anticipated the coming of troubles takes away their power when they arrive.","author":"Seneca","explanation":"The practice of 'premeditatio malorum' (negative visualization) is a cognitive tool that strips challenges of their shock value and reduces anxiety."},{"day":155,"quote":"The greater the difficulty, the more glory in surmounting it.","author":"Epictetus","explanation":"The size of the challenge determines the strength and virtue you gain by overcoming it. This reframes difficulty as opportunity."},{"day":156,"quote":"He suffers more than necessary, who suffers before it is necessary.","author":"Seneca","explanation":"Anxious worry about future problems means you experience them twice: once in imagination and once (if ever) in reality."},{"day":157,"quote":"It does not matter what you bear, but how you bear it.","author":"Seneca","explanation":"The true measure of character is not the hardship you face, but the grace, wisdom, and resilience with which you face it."},{"day":158,"quote":"Pain is inevitable. Suffering is optional.","author":"Anonymous","explanation":"This perfectly captures the DBT concept of 'clean pain' (the inevitable pain of life) versus 'dirty pain' (the extra suffering we add with our judgments and non-acceptance)."},{"day":159,"quote":"The trials you encounter will introduce you to your strengths.","author":"Epictetus","explanation":"You don't know how strong you are until you are tested. Adversity reveals your hidden capabilities and builds self-efficacy."},{"day":160,"quote":"Here is a rule to remember in future, when anything tempts you to feel bitter: not 'This is misfortune,' but 'To bear this worthily is good fortune.'","author":"Marcus Aurelius","explanation":"This is a powerful cognitive reframe. The real victory is not avoiding hardship, but using it as an opportunity to demonstrate courage and integrity."},{"day":161,"quote":"Fire tests gold, suffering tests brave men.","author":"Seneca","explanation":"Just as precious metals are purified by fire, our character is strengthened and proven by hardship."},{"day":162,"quote":"The brave man is not he who does not feel afraid, but he who conquers that fear.","author":"Seneca","explanation":"Courage isn't the absence of fear; it's the conscious choice to act virtuously and effectively despite feeling fear."},{"day":163,"quote":"The measure of a man is the way he bears the misfortunes that are beyond his control.","author":"Epictetus","explanation":"Your character is revealed in how you apply distress tolerance skills to handle things you cannot change."},{"day":164,"quote":"Be like the cliff against which the waves continually break; but it stands firm and tames the fury of the water around it.","author":"Marcus Aurelius","explanation":"Cultivate an inner stability so strong that it remains unshaken by external chaos. This is the goal of a resilient mind."},{"day":165,"quote":"The bravest sight in the world is to see a great man struggling against adversity.","author":"Seneca","explanation":"There is profound dignity and inspiration in watching someone face hardship with courage and integrity."},{"day":166,"quote":"You can bind up my leg, but not even Zeus has the power to break my freedom of choice.","author":"Epictetus","explanation":"Your body and circumstances can be constrained, but your will—your power to choose your response—is always sovereign."},{"day":167,"quote":"A hero is an ordinary individual who finds the strength to persevere and endure in spite of overwhelming obstacles.","author":"Christopher Reeve","explanation":"A modern take on resilience, defining heroism not by ability, but by the strength of will in the face of adversity."},{"day":168,"quote":"The soul's greatness is when it is unshaken and undisturbed.","author":"Seneca","explanation":"True strength of character is demonstrated by a mind that maintains its calm and reason in all circumstances."},{"day":169,"quote":"I am not what happened to me, I am what I choose to become.","author":"Carl Jung","explanation":"A core tenet of existential and humanistic psychology: your past does not define you. Your identity is forged by the choices you make now."},{"day":170,"quote":"There is nothing good or bad, but thinking makes it so.","author":"William Shakespeare","explanation":"A perfect literary expression of the core cognitive model: events are neutral, and our interpretation assigns them value."},{"day":171,"quote":"Smooth seas do not make skillful sailors.","author":"Proverb","explanation":"This universal truth highlights that skills like resilience and wisdom are not developed in times of ease, but in navigating the storms of life."},{"day":172,"quote":"What is to give light must endure burning.","author":"Viktor Frankl","explanation":"To be a source of strength and wisdom for others often requires that you first pass through your own trials by fire."},{"day":173,"quote":"Fall seven times, stand up eight.","author":"Japanese Proverb","explanation":"This captures the essence of resilience. It's not about never falling, but about the unwavering will to rise again each time."},{"day":174,"quote":"He is a fool who is not a master of his own will.","author":"Epictetus","explanation":"The ultimate foolishness is to have a weak will, allowing yourself to be controlled by external events and fleeting passions."},{"day":175,"quote":"Gold is tested by fire, people by adversity.","author":"Seneca","explanation":"Just as fire reveals the purity of gold, hardship reveals the quality of a person's character."},{"day":176,"quote":"A setback has often cleared the way for greater prosperity.","author":"Seneca","explanation":"Sometimes, what appears to be a failure is actually the event that redirects you to a better path. This is a form of cognitive reframing."},{"day":177,"quote":"The Fates guide the person who accepts them and hinder the person who resists them.","author":"Cleanthes","explanation":"Resilience comes from working with reality (acceptance), not fighting against it. Accept what has happened and act from there."},{"day":178,"quote":"A man's character is his fate.","author":"Heraclitus","explanation":"The resilience and virtue you cultivate in yourself will ultimately determine the course of your life."},{"day":179,"quote":"Misfortune is virtue's opportunity.","author":"Seneca","explanation":"Do not see adversity as a curse. See it as the perfect occasion to practice courage, patience, and wisdom."},{"day":180,"quote":"The will to win is important, but the will to prepare is vital.","author":"Joe Paterno","explanation":"Resilience isn't just about the moment of crisis. It's built in the daily, disciplined preparation of the mind and character."},{"day":181,"quote":"No one is crushed by misfortune unless he has first been deceived by prosperity.","author":"Seneca","explanation":"If you become too attached to good times (an external), you will be fragile in bad times. Resilience requires indifference to both."},{"day":182,"quote":"The only way out of the labyrinth of suffering is to forgive.","author":"John Green","explanation":"A modern literary take on a deep psychological truth: holding onto anger and resentment perpetuates your own suffering. Forgiveness is a path to freedom."},{"day":183,"quote":"Dialectics is the art of investigating the truth of opinions.","author":"Plato","explanation":"This is the core of DBT: finding a synthesis between two opposites, like acceptance and change, to arrive at a more effective truth."},{"day":184,"quote":"The emotion that can break your heart is sometimes the very one that heals it...","author":"Nicholas Sparks","explanation":"This speaks to the transformative power of emotional processing. Allowing oneself to fully experience difficult emotions is often necessary for healing."},{"day":185,"quote":"Persistence and resilience only come from having been given the chance to work through difficult problems.","author":"Gever Tulley","explanation":"You cannot learn to be strong without lifting heavy psychological weights. Character is built by confronting and solving challenges."},{"day":186,"quote":"It is a foolish man who is surprised by a storm.","author":"Seneca","explanation":"A resilient mind prepares for adversity in times of calm ('premeditatio malorum'), so it is not shocked when trouble arrives."},{"day":187,"quote":"The spirit is unbreakable.","author":"Seneca","explanation":"External forces can harm the body, but your inner will, your rational mind, is beyond their reach if you so choose."},{"day":188,"quote":"The only thing that is not in the power of the Fates is to change a man's character.","author":"Seneca","explanation":"Events are outside your control, but the resilience and virtue of your response are always yours to command."},{"day":189,"quote":"The harder the conflict, the more glorious the triumph.","author":"Thomas Paine","explanation":"The value of your resilience and the growth you gain is measured by the magnitude of the challenge you overcome."},{"day":190,"quote":"Radical acceptance rests on letting go of the illusion of control and a willingness to notice and accept things as they are right now, without judging.","author":"Marsha M. Linehan","explanation":"The creator of DBT defines one of its core skills: accepting reality reduces suffering and creates the foundation for skillful action."},{"day":191,"quote":"A diamond is a chunk of coal that did well under pressure.","author":"Henry Kissinger","explanation":"A powerful metaphor for how human excellence and resilience are not born of ease, but are forged under the intense pressure of life's challenges."},{"day":192,"quote":"The soul's greatness is when it is unshaken and undisturbed.","author":"Seneca","explanation":"True strength of character is demonstrated by a mind that maintains its calm and reason in all circumstances."},{"day":193,"quote":"It is not because things are difficult that we do not dare, but because we do not dare that they are difficult.","author":"Seneca","explanation":"Our own fear and hesitation are often the biggest obstacles. The act of daring to try makes challenges surmountable."},{"day":194,"quote":"A man's fears are lighter when the danger is at hand.","author":"Seneca","explanation":"The anxiety we feel in anticipation of a problem is often far worse than the reality of dealing with it."},{"day":195,"quote":"What need is there to weep over parts of life? The whole of it calls for tears.","author":"Seneca","explanation":"A morbid but bracing reminder to accept suffering as a fundamental part of life, rather than being surprised by each instance."},{"day":196,"quote":"We are disturbed not by what happens to us, but by our thoughts about what happens.","author":"Epictetus","explanation":"This is a core tenet of Stoicism. Your internal judgment, not the external event, is the source of your suffering."},{"day":197,"quote":"It is a great man that can treat his earthenware as if it was silver, and a man who treats his silver as if it was earthenware is no less great.","author":"Seneca","explanation":"A resilient mind is indifferent to material wealth, treating both poverty and riches with the same calm detachment."},{"day":198,"quote":"The wise person has a 'reserve clause' for all actions.","author":"Donald Robertson","explanation":"A modern Stoic explains the practice of acting with the caveat '...fate permitting,' which builds resilience by separating your effort from the outcome."},{"day":199,"quote":"A ship should not ride on a single anchor, nor life on a single hope.","author":"Epictetus","explanation":"Build resilience by diversifying your sources of meaning and not pinning all your happiness on one external outcome."},{"day":200,"quote":"There is no genius without a touch of madness.","author":"Aristotle","explanation":"Great insight and creativity often require a departure from conventional thinking, a willingness to appear foolish or mad to others."},{"day":201,"quote":"He who has overcome his fears will truly be free.","author":"Aristotle","explanation":"Inner freedom is achieved by conquering the passions and anxieties that enslave the will."}],"mindset_and_inner_peace":[{"day":202,"quote":"Wealth consists not in having great possessions, but in having few wants.","author":"Epictetus","explanation":"True richness comes from desiring little (managing desire), not from accumulating much (an external)."},{"day":203,"quote":"The happiness of your life depends upon the quality of your thoughts.","author":"Marcus Aurelius","explanation":"Your inner state, governed by your cognitive processes, is the primary source of your happiness and well-being."},{"day":204,"quote":"Very little is needed to make a happy life; it is all within yourself, in your way of thinking.","author":"Marcus Aurelius","explanation":"Happiness is a product of your inner world of thoughts and values, not your external circumstances."},{"day":205,"quote":"Our life is what our thoughts make it.","author":"Marcus Aurelius","explanation":"The reality you experience is shaped and colored by the nature of your habitual cognitive patterns."},{"day":206,"quote":"The soul becomes dyed with the color of its thoughts.","author":"Marcus Aurelius","explanation":"Your character and emotional state are formed by what you consistently think about. Choose your thoughts with care."},{"day":207,"quote":"There is only one way to happiness and that is to cease worrying about things which are beyond the power of our will.","author":"Epictetus","explanation":"Inner peace comes from applying the dichotomy of control: focusing on what you can influence and accepting what you can't."},{"day":208,"quote":"To live a good life: We have the potential for it. If we can learn to be indifferent to what makes no difference.","author":"Marcus Aurelius","explanation":"A good life is possible when you stop giving emotional weight to things that are external and ultimately unimportant to your character."},{"day":209,"quote":"The mind that is anxious about future events is miserable.","author":"Marcus Aurelius","explanation":"Worrying about the future ruins the present and accomplishes nothing. Practice bringing your focus to the present moment."},{"day":210,"quote":"He is a wise man who does not grieve for the things which he has not, but rejoices for those which he has.","author":"Epictetus","explanation":"Practice gratitude for what is present in your life rather than cognitive distortions like rumination about what is absent."},{"day":211,"quote":"Never let the future disturb you. You will meet it, if you have to, with the same weapons of reason which today arm you against the present.","author":"Marcus Aurelius","explanation":"Trust in your coping abilities. The same inner strength and reason you use today will be sufficient for tomorrow's challenges."},{"day":212,"quote":"The best years of your life are the ones in which you decide your problems are your own. You do not blame them on your mother, the ecology, or the president.","author":"Albert Ellis","explanation":"Taking radical responsibility for your own emotional responses is the cornerstone of psychological health and empowerment."},{"day":213,"quote":"It is the power of the mind to be unconquerable.","author":"Seneca","explanation":"When your mind is grounded in reason and virtue, no external event can truly defeat your inner self."},{"day":214,"quote":"The things you think about determine the quality of your mind.","author":"Marcus Aurelius","explanation":"Your mental landscape is built from the thoughts you entertain. Cultivate a virtuous and rational one."},{"day":215,"quote":"Retire into yourself. The rational principle which rules has this nature, that it is content with itself when it does what is just, and so secures tranquility.","author":"Marcus Aurelius","explanation":"Find peace by turning inward and aligning your actions with your rational and virtuous nature."},{"day":216,"quote":"Your mind will take the shape of what you frequently hold in thought, for the human spirit is colored by such impressions.","author":"Marcus Aurelius","explanation":"Be mindful of your mental diet; your character and emotional state are shaped by the thoughts you consistently entertain."},{"day":217,"quote":"You become what you give your attention to.","author":"Epictetus","explanation":"Your focus shapes your reality and your character. Direct it wisely toward what is virtuous and within your control."},{"day":218,"quote":"The universe is change; our life is what our thoughts make it.","author":"Marcus Aurelius","explanation":"In a world of constant flux, your stable inner life is created by the quality of your thinking."},{"day":219,"quote":"Receive without pride, let go without attachment.","author":"Marcus Aurelius","explanation":"Accept good fortune humbly and release it without clinging when it's time for it to go. This is practicing non-attachment to externals."},{"day":220,"quote":"Remember that very little is needed to make a happy life.","author":"Marcus Aurelius","explanation":"Stop searching for happiness in external things; it is an internal state you can access now through virtuous thought and action."},{"day":221,"quote":"The greatest wealth is a poverty of desires.","author":"Seneca","explanation":"Ultimate freedom and peace come from mastering your desires, not from endlessly trying to satisfy them."},{"day":222,"quote":"The interpretation of a situation, rather than the situation itself, determines the emotional response.","author":"Aaron T. Beck","explanation":"A concise summary of the cognitive model from its founder, highlighting the link between thoughts (interpretation) and feelings (response)."},{"day":223,"quote":"Curb your desire—don’t set your heart on so many things and you will get what you need.","author":"Epictetus","explanation":"By reducing your wants and attachments, you increase the probability of satisfaction and find peace in simplicity."},{"day":224,"quote":"When you arise in the morning, think of what a precious privilege it is to be alive—to breathe, to think, to enjoy, to love.","author":"Marcus Aurelius","explanation":"Start each day with an act of gratitude for the simple fact of your existence. This mindset is a foundation for inner peace."},{"day":225,"quote":"A man who is a master of himself can end a sorrow as easily as he can invent a pleasure.","author":"Seneca","explanation":"A disciplined mind has power over its internal states, able to dismiss negative emotions and cultivate positive ones through rational thought."},{"day":226,"quote":"Peace of mind is that mental condition in which you have accepted the worst.","author":"Lin Yutang","explanation":"This modern take on 'premeditatio malorum' shows that by mentally preparing for the worst, you rob it of its power to create anxiety."},{"day":227,"quote":"What's the good of dragging up sufferings which are over?","author":"Seneca","explanation":"Inner peace requires letting go of rumination on the past. Don't allow yesterday's pains to poison today's tranquility."},{"day":228,"quote":"Automatic thoughts are involuntary and pop into our minds without conscious thought.","author":"Aaron T. Beck","explanation":"A key concept of CBT: learn to identify these automatic thoughts so you can evaluate their accuracy and usefulness."},{"day":229,"quote":"The greatest blessings of mankind are within us and within our reach.","author":"Seneca","explanation":"Do not look for peace and happiness in the external world. A virtuous mind and rational will are all you need."},{"day":230,"quote":"A happy life is one which is in accordance with its own nature.","author":"Seneca","explanation":"Peace comes from living authentically, guided by reason—the highest faculty of your human nature."},{"day":231,"quote":"The less we deserve good fortune, the more we enjoy it.","author":"Seneca","explanation":"A mindset of humility and non-entitlement allows you to experience genuine gratitude for the good things in life."},{"day":232,"quote":"Be satisfied with your business, and learn to love what you were bred to.","author":"Marcus Aurelius","explanation":"Find peace and purpose in your given role. Do your work with diligence and without wishing you were somewhere else."},{"day":233,"quote":"Emotional suffering is a signal that you have a problem to solve.","author":"Marsha M. Linehan","explanation":"Emotions are information. Use them as cues to engage in problem-solving or to practice distress tolerance skills."},{"day":234,"quote":"Set aside a certain number of days, during which you shall be content with the scantiest and cheapest fare...saying... 'Is this the condition that I feared?'","author":"Seneca","explanation":"Practice voluntary hardship (a behavioral experiment) to inoculate yourself against the fear of misfortune. This builds resilience and inner peace."},{"day":235,"quote":"A person's fears are lighter when the danger is at hand.","author":"Seneca","explanation":"The anxiety of anticipation is often worse than the reality of the event. Don't let your mind torment you."},{"day":236,"quote":"We should every night call ourselves to an account: what infirmity have I mastered today? What passion opposed? What temptation resisted?","author":"Seneca","explanation":"Inner peace is the result of daily self-reflection and incremental progress in self-mastery."},{"day":237,"quote":"If you wish to be loved, love.","author":"Seneca","explanation":"Do not focus on what you receive from others. The source of a peaceful social life is the virtue you yourself put into it."},{"day":238,"quote":"The tranquility that comes when you stop caring what they say. Or think, or do. Only what you do.","author":"Marcus Aurelius","explanation":"Find peace by focusing your attention entirely on the integrity of your own actions, not on the uncontrollable opinions of others."},{"day":239,"quote":"It is the mark of an educated mind to be able to entertain a thought without accepting it.","author":"Aristotle","explanation":"Inner peace requires cognitive distancing—the ability to observe your thoughts objectively without being controlled by them."},{"day":240,"quote":"Within ten days you will seem a god to those to whom you are now a beast and an ape, if you will return to your principles and the worship of reason.","author":"Marcus Aurelius","explanation":"Dramatic transformation and the restoration of inner peace are possible in a short time if you commit fully to living by reason."},{"day":241,"quote":"A man's peace of mind does not depend on the will of others.","author":"Epictetus","explanation":"Your tranquility is your own responsibility. Do not hand the keys to your inner state over to anyone else."},{"day":242,"quote":"Let not your thoughts be flying away from the definition of the thing that is before you.","author":"Marcus Aurelius","explanation":"Peace comes from seeing things with cognitive clarity and precision, stripped of emotional drama and false judgments."},{"day":243,"quote":"Silence is a lesson learned from the many sufferings of life.","author":"Seneca","explanation":"Wisdom and hardship often teach the value of quiet contemplation over reactive speech."},{"day":244,"quote":"Be like a rocky promontory against which the restless surf continually pounds.","author":"Marcus Aurelius","explanation":"Cultivate an unshakable inner peace that stands firm and calm amidst the chaos of the external world."},{"day":245,"quote":"The memory of the good is a blessing.","author":"Marcus Aurelius","explanation":"Cultivate and recall positive memories as a source of strength and inner peace in the present moment."},{"day":246,"quote":"Not to feel exasperated, or defeated, or despondent...But to get back up when you fail, to celebrate behaving like a human—however imperfectly.","author":"Marcus Aurelius","explanation":"Inner peace requires self-compassion. It's not about perfection, but about resiliently returning to your principles after you stumble."},{"day":247,"quote":"The first step toward true enlightenment is to be aware of the poison in one's own mind.","author":"Zhuangzi","explanation":"Inner peace begins with the honest self-reflection needed to identify your own irrational fears, judgments, and desires."},{"day":248,"quote":"How much better to heal than seek revenge from an injury.","author":"Seneca","explanation":"Focus your energy on restoring your own inner peace and character, which is a far more productive and virtuous path than vengeance."},{"day":249,"quote":"Show me a man who is not a slave; one is a slave to lust, another to greed...and all men are slaves to fear.","author":"Seneca","explanation":"True freedom is inner freedom from the tyranny of your own irrational passions. This is the goal of a peaceful mind."},{"day":250,"quote":"We are not given a short life but we make it short, and we are not ill-supplied but wasteful of it.","author":"Seneca","explanation":"A peaceful life feels long and full. A life wasted on non-essentials feels short and chaotic."},{"day":251,"quote":"A conscience that is clear is a priceless jewel.","author":"Seneca","explanation":"The ultimate source of inner peace is knowing that you have acted in accordance with virtue and your own best judgment."},{"day":252,"quote":"People have a problem with their lives. They have a problem with their emotions. They have a problem with their thoughts. They have a problem with their behaviors.","author":"Marsha M. Linehan","explanation":"A direct statement from the founder of DBT, outlining the domains where we must apply skills to build a life worth living."},{"day":253,"quote":"Stop allowing your mind to be a slave, to be jerked about by selfish impulses, to kick against fate and the present, and to mistrust the future.","author":"Marcus Aurelius","explanation":"Assert your rational will over your own mind. This is the fundamental practice for achieving inner peace."},{"day":254,"quote":"When a man is undisturbed by the decision of his own judgment, he is a force of nature.","author":"Epictetus","explanation":"A mind at peace with its own rational choices has an unshakeable strength and stability."}],"time_and_mortality":[{"day":255,"quote":"It is not that we have a short time to live, but that we waste a lot of it.","author":"Seneca","explanation":"The problem isn't the length of life, but how inefficiently and without purpose we often live it."},{"day":256,"quote":"It is not death that a man should fear, but he should fear never beginning to live.","author":"Marcus Aurelius","explanation":"The real tragedy is a life unlived, a life not aligned with one's values, not the natural end of life."},{"day":257,"quote":"We suffer more often in imagination than in reality.","author":"Seneca","explanation":"Our anxieties and catastrophic thoughts about what might happen cause us more pain than actual events."},{"day":258,"quote":"Begin at once to live, and count each separate day as a separate life.","author":"Seneca","explanation":"Don't postpone living. Treat every day as a complete life in itself, with a beginning, middle, and end, to be lived virtuously."},{"day":259,"quote":"As is a tale, so is life: not how long it is, but how good it is, is what matters.","author":"Seneca","explanation":"The quality and virtue of your life are more important than its duration."},{"day":260,"quote":"They lose the day in expectation of the night, and the night in fear of the dawn.","author":"Seneca","explanation":"People waste the present moment by anxiously anticipating the future or dreading what's to come."},{"day":261,"quote":"Life is like a play: it's not the length, but the excellence of the acting that matters.","author":"Seneca","explanation":"Focus on playing your role in life virtuously, regardless of how long the play lasts."},{"day":262,"quote":"Do not act as if you were going to live ten thousand years. Death hangs over you. While you live, while it is in your power, be good.","author":"Marcus Aurelius","explanation":"The awareness of your mortality (memento mori) should inspire you to live virtuously in the present moment."},{"day":263,"quote":"Time heals what reason cannot.","author":"Seneca","explanation":"Some wounds and griefs are lessened by the natural passage of time when intellectual cognitive restructuring falls short."},{"day":264,"quote":"While we wait for life, life passes.","author":"Seneca","explanation":"If you are always preparing to live, you will never actually start living. Engage in the present."},{"day":265,"quote":"You act like mortals in all that you fear, and like immortals in all that you desire.","author":"Seneca","explanation":"We anxiously fear things as if our time is short, yet we postpone our goals and values as if we have endless time."},{"day":266,"quote":"Let us prepare our minds as if we’d come to the very end of life. Let us postpone nothing.","author":"Seneca","explanation":"Live with a sense of urgency, embracing your duties and joys now, not later."},{"day":267,"quote":"The part of life we really live is small. For all the rest of existence is not life, but merely time.","author":"Seneca","explanation":"True 'living' happens in moments of conscious, value-driven action; the rest is just the passing of time."},{"day":268,"quote":"Your days are numbered. Use them to throw open the windows of your soul to the sun.","author":"Marcus Aurelius","explanation":"Recognize the brevity of life and use your limited time to seek wisdom, truth, and inner light."},{"day":269,"quote":"While the fates permit, live happily; life speeds on with hurried step...","author":"Seneca","explanation":"Embrace the present joyfully and virtuously, because time is fleeting and waits for no one."},{"day":270,"quote":"No one can have a peaceful life who thinks too much about lengthening it.","author":"Seneca","explanation":"Obsessing over extending your lifespan creates anxiety that ruins the quality of the life you have."},{"day":271,"quote":"Think of yourself as dead. You have lived your life. Now, take what's left and live it properly.","author":"Marcus Aurelius","explanation":"This mental exercise frees you from past mistakes and future anxieties, allowing you to focus on living virtuously now."},{"day":272,"quote":"The blaze of a reputation cannot be sustained by the ashes of the dead.","author":"Seneca","explanation":"Your legacy is in the virtue of your life, not in the fame that may or may not follow your death."},{"day":273,"quote":"The problem with many people is they think they have time.","author":"Carlos Castaneda","explanation":"This anthropological insight mirrors the Stoic warning against acting as if your time is infinite. The illusion of endless time leads to procrastination."},{"day":274,"quote":"It is not that we are given a short life but we make it short.","author":"Seneca","explanation":"Life feels short when we waste it on non-essentials. A life lived with purpose and virtue feels full, regardless of its length."},{"day":275,"quote":"The Present is the only thing a man can be deprived of.","author":"Marcus Aurelius","explanation":"You cannot lose the past (it's gone) or the future (it's not here). Your only possession is this present moment. Use it well."},{"day":276,"quote":"The time will come when you will be nowhere and nobody.","author":"Marcus Aurelius","explanation":"Reflect on your own impermanence not to be morbid, but to appreciate the present and act with purpose."},{"day":277,"quote":"Let each thing you would do, say, or intend, be like that of a dying person.","author":"Marcus Aurelius","explanation":"The thought of your imminent end brings clarity and moral seriousness to your present actions."},{"day":278,"quote":"We are always complaining that our days are few, and acting as though there would be no end of them.","author":"Seneca","explanation":"Our actions contradict our awareness of mortality. Live as if you understand that your time is finite."},{"day":279,"quote":"Soon you will have forgotten all things: and soon all things will have forgotten you.","author":"Marcus Aurelius","explanation":"This is not a cause for despair, but for liberation. It frees you to act virtuously for its own sake, not for lasting fame."},{"day":280,"quote":"The common cognitive distortion is to believe that since an event is catastrophic, it is also highly probable.","author":"David D. Burns","explanation":"A leading CBT psychologist points out how we overestimate the likelihood of our fears, urging us to assess probabilities realistically."},{"day":281,"quote":"The fear of death follows from the fear of life.","author":"Mark Twain","explanation":"A person who is afraid of living fully and taking risks is the one who is most afraid of life ending."},{"day":282,"quote":"That which has existed is now, and that which is to be has already been.","author":"Ecclesiastes","explanation":"Recognize the cyclical nature of human experience. This perspective provides stability and peace."},{"day":283,"quote":"This is our big mistake: to think we look forward to death. Most of death is already gone. Whatever time has passed is owned by death.","author":"Seneca","explanation":"Don't see death as a future event. It is a process that is happening now. Every moment that passes belongs to it. Live accordingly."},{"day":284,"quote":"A man does not die because he is sick, but because he is alive.","author":"Seneca","explanation":"Death is not an accident or a failure; it is the natural and inevitable consequence of being born."},{"day":285,"quote":"It's not about avoiding death, but about living a life that's worth dying for.","author":"Ryan Holiday","explanation":"A modern Stoic take: focus on the quality and purpose of your actions, making your life meaningful regardless of its length."},{"day":286,"quote":"Perfection of character is this: to live each day as if it were your last, without frenzy, without apathy, without pretense.","author":"Marcus Aurelius","explanation":"The awareness of mortality should lead to a calm, engaged, and authentic way of living in the present."},{"day":287,"quote":"The longest portion of our life is the one we live for others.","author":"Seneca","explanation":"Much of our time is spent on obligations and duties. Ensure the small portion you have for yourself is lived with wisdom."},{"day":288,"quote":"Of all the things which wisdom provides to make life entirely happy, much the greatest is the possession of friendship.","author":"Epicurus","explanation":"While Stoics valued self-sufficiency, they, like other ancient philosophers, recognized the profound importance of virtuous relationships."},{"day":289,"quote":"Every hour of every day is a test.","author":"Marcus Aurelius","explanation":"Each moment presents an opportunity to practice virtue, patience, and reason. Your life is a continuous examination of your character."},{"day":290,"quote":"You can't change the past, but you can ruin the present by worrying about the future.","author":"Albert Ellis","explanation":"A succinct psychological truth: focus your energy on the present moment, as it's the only one you can influence."},{"day":291,"quote":"Life, if well lived, is long enough.","author":"Seneca","explanation":"A life filled with virtuous action and purpose feels complete, regardless of its length in years."},{"day":292,"quote":"Alexander the Great and his mule driver both died and the same thing happened to both.","author":"Marcus Aurelius","explanation":"Death is the great equalizer. Status, wealth, and power are irrelevant in the end. Only your character has lasting worth."},{"day":293,"quote":"You could leave life right now. Let that determine what you do and say and think.","author":"Marcus Aurelius","explanation":"This is the ultimate filter for your actions. Let the reality of your mortality guide you to what is truly important."},{"day":294,"quote":"Men do not care how nobly they live, but only how long, although it is within the reach of every man to live nobly, but within no man's power to live long.","author":"Seneca","explanation":"We obsess over what we cannot control (length of life) and neglect what we can (quality of life)."},{"day":295,"quote":"It is not death that is terrible, but the terrified death.","author":"Epictetus","explanation":"The event of dying is natural and neutral. The suffering comes from the fear and anxiety we attach to it."},{"day":296,"quote":"He who has made a fair compact with poverty is rich.","author":"Seneca","explanation":"By mentally preparing for and accepting the possibility of having little, you free yourself from the fear of it and find a different kind of wealth."},{"day":297,"quote":"No man can have a peaceful life who thinks too much about lengthening it.","author":"Seneca","explanation":"Constant anxiety about extending your life prevents you from living the life you currently have with peace and virtue."},{"day":298,"quote":"Cease to hope and you will cease to fear.","author":"Seneca","explanation":"Fear and hope are two sides of the same coin: attachment to a future you don't control. By giving up obsessive hope for a specific outcome, you also free yourself from the fear of not getting it."},{"day":299,"quote":"The whole future lies in uncertainty: live immediately.","author":"Seneca","explanation":"Don't postpone living while waiting for a certain future. The only time you can truly live is now."},{"day":300,"quote":"What is the point of fearing a thing which is inevitable?","author":"Epictetus","explanation":"Wasting mental energy fearing death is irrational, as it is a natural and unavoidable part of life."},{"day":301,"quote":"The most grievous of all losses is the loss of time.","author":"Seneca","explanation":"Unlike money or property, lost time can never be recovered. It is your most precious and non-renewable resource."},{"day":302,"quote":"We all have the same end; the only difference is the road we take.","author":"Seneca","explanation":"Since death is the common destination for all, the meaning of life is found in the virtuous manner in which you travel your unique path."},{"day":303,"quote":"Every man's life is a journey to death.","author":"Seneca","explanation":"This perspective isn't meant to be morbid, but to encourage a focused and purposeful life, knowing the destination is fixed."},{"day":304,"quote":"There is no saint without a past, no sinner without a future.","author":"Augustine of Hippo","explanation":"A theological idea with deep psychological truth: everyone has the capacity for change. Your past actions do not define your future potential for virtue."},{"day":305,"quote":"He who is not prepared today will be less so tomorrow.","author":"Ovid","explanation":"The time to cultivate the virtues needed for life's challenges is always now. Procrastination only weakens your resolve."},{"day":306,"quote":"The wise man is a teacher of the art of living.","author":"Zeno of Citium","explanation":"The ultimate purpose of wisdom is not private contemplation, but the practical application and teaching of how to live a virtuous life."}],"relationships_and_society":[{"day":307,"quote":"The best revenge is to be unlike him who performed the injury.","author":"Marcus Aurelius","explanation":"Responding to wrongdoing with virtue is the highest and most effective form of 'revenge', preserving your own character."},{"day":308,"quote":"The key is to keep company only with people who uplift you, whose presence calls forth your best.","author":"Epictetus","explanation":"Choose your companions wisely, as they have a significant influence on your character and behavior through social modeling."},{"day":309,"quote":"Attach yourself to what is spiritually superior, regardless of what other people think or do.","author":"Epictetus","explanation":"Commit to your principles and virtuous role models, even if it means going against social pressure."},{"day":310,"quote":"I have often wondered how it is that every man loves himself more than all the rest of men, but yet sets less value on his own opinion of himself than on the opinion of others.","author":"Marcus Aurelius","explanation":"A paradox of human psychology: we are self-centered, yet we often value social approval over our own rational judgment."},{"day":311,"quote":"Be tolerant with others and strict with yourself.","author":"Marcus Aurelius","explanation":"Hold yourself to a high standard of virtue while showing patience and understanding for the faults of others."},{"day":312,"quote":"Associate with people who are likely to improve you.","author":"Seneca","explanation":"Your character is influenced by the people you spend the most time with. Choose them carefully."},{"day":313,"quote":"What is rational is universal, and what is universal is rational.","author":"Marcus Aurelius","explanation":"The principles of reason and virtue are common to all humanity, forming the basis for a universal ethics."},{"day":314,"quote":"How much more grievous are the consequences of anger than the causes of it.","author":"Marcus Aurelius","explanation":"The harm your own anger does to your character and peace of mind is often worse than the initial offense."},{"day":315,"quote":"That which is not good for the bee-hive cannot be good for the bees.","author":"Marcus Aurelius","explanation":"What harms the community ultimately harms the individual. Our well-being is interconnected."},{"day":316,"quote":"One of the most beautiful qualities of true friendship is to understand and to be understood.","author":"Seneca","explanation":"Mutual understanding and empathy, key components of interpersonal effectiveness, are at the heart of any meaningful friendship."},{"day":317,"quote":"The object of life is not to be on the side of the majority, but to escape finding oneself in the ranks of the insane.","author":"Marcus Aurelius","explanation":"Prioritize truth and reason over popular opinion, which is often guided by cognitive biases and emotional contagion."},{"day":318,"quote":"Be careful to leave your sons well instructed rather than rich, for the hopes of the instructed are better than the wealth of the ignorant.","author":"Epictetus","explanation":"Passing on wisdom and virtue is a far greater inheritance than material wealth."},{"day":319,"quote":"When you are offended at any man's fault, turn to yourself and study your own failings. Then you will forget your anger.","author":"Epictetus","explanation":"Practicing self-awareness and humility is an effective antidote to anger at others' imperfections."},{"day":320,"quote":"Begin each day by telling yourself: Today I shall be meeting with interference, ingratitude, insolence... all of them due to the offenders’ ignorance of what is good or evil.","author":"Marcus Aurelius","explanation":"Prepare yourself for others' faults not with cynicism, but with the understanding that they act from ignorance, not malice. This is a cognitive coping strategy."},{"day":321,"quote":"Wherever there is a human being, there is an opportunity for a kindness.","author":"Seneca","explanation":"Every interaction is a chance to practice the prosocial virtue of kindness."},{"day":322,"quote":"What is a friend? A single soul dwelling in two bodies.","author":"Aristotle","explanation":"True friendship is a profound connection based on shared virtue and mutual goodwill."},{"day":323,"quote":"The wise man is not he who knows many things, but he who knows useful things.","author":"Aeschylus","explanation":"The value of knowledge lies in its practical application to living a virtuous life and helping others."},{"day":324,"quote":"We are not born for ourselves alone.","author":"Cicero","explanation":"As social beings, we have a natural duty to our family, our community, and humanity as a whole."},{"day":325,"quote":"The way to love anything is to realize that it may be lost.","author":"G.K. Chesterton","explanation":"This literary insight mirrors the Stoic practice of negative visualization to cultivate gratitude for the people and things in our lives."},{"day":326,"quote":"No man is an island, entire of itself; every man is a piece of the continent, a part of the main.","author":"John Donne","explanation":"A literary expression of the psychological truth of our interconnectedness. The well-being of the whole affects the individual."},{"day":327,"quote":"The only way to have a friend is to be one.","author":"Ralph Waldo Emerson","explanation":"Friendship is not something you get, but something you create through your own virtuous and prosocial behaviors."},{"day":328,"quote":"If you want to lift yourself up, lift up someone else.","author":"Booker T. Washington","explanation":"Helping others (prosocial behavior) is one of the most effective ways to improve your own character and sense of well-being."},{"day":329,"quote":"We are members of one great body... We must consider that we are born for the good of the whole.","author":"Seneca","explanation":"Your primary duty is to the human community. Act in a way that benefits all of humanity (circles of concern)."},{"day":330,"quote":"A man's true greatness lies in the consciousness of an honest purpose in life.","author":"Joseph Conrad","explanation":"A good life in society is built on self-awareness and a virtuous, purposeful engagement with the world."},{"day":331,"quote":"The just man is not the one who does no injustice, but the one who, having the power, does not wish to do it.","author":"Democritus","explanation":"True virtue is not merely the absence of wrongdoing, but the conscious choice to act justly."},{"day":332,"quote":"Men exist for the sake of one another. Teach them then or bear with them.","author":"Marcus Aurelius","explanation":"Your duty to others is twofold: to help them learn virtue (psychoeducation), or to patiently endure their ignorance (distress tolerance)."},{"day":333,"quote":"A benefit consists not in what is done or given, but in the intention of the giver or doer.","author":"Seneca","explanation":"The virtue of an act of kindness lies in the will behind it, not in the material gift itself."},{"day":334,"quote":"He who has a why to live for can bear almost any how.","author":"Friedrich Nietzsche","explanation":"A strong sense of purpose (a 'why'), often found in service to others, provides the psychological resilience to endure any hardship."},{"day":335,"quote":"We are all leaves of a single tree, and the life of each is the life of all.","author":"Seneca","explanation":"Humanity is a single organism. The health of the whole depends on the health of each individual part."},{"day":336,"quote":"Whoever does wrong, wrongs himself.","author":"Marcus Aurelius","explanation":"The primary victim of an unjust act is the person who commits it, for they have corrupted their own character."},{"day":337,"quote":"The first step in the acquisition of wisdom is silence, the second listening, the third memory, the fourth practice, the fifth teaching others.","author":"Solomon ibn Gabirol","explanation":"A medieval philosopher's step-by-step guide to skill acquisition, culminating in sharing wisdom for the benefit of the community."},{"day":338,"quote":"The reward for a good deed is to have done it.","author":"Seneca","explanation":"Virtuous action is intrinsically reinforcing. Do not look for external praise or compensation."},{"day":339,"quote":"Life is short—the fruit of this life is a good character and acts for the common good.","author":"Marcus Aurelius","explanation":"The essence of a well-lived life is simple: cultivate a virtuous character and dedicate your actions to helping others."},{"day":340,"quote":"Humans have been born for the sake of other humans. So either teach them, or tolerate them.","author":"Marcus Aurelius","explanation":"You have two primary duties in society: to educate others towards virtue, or to bear their failings with patience."},{"day":341,"quote":"A royal spirit is a man who can look things in the face, who is not frightened by the roar of the crowd.","author":"Seneca","explanation":"True leadership and virtue require the courage to stand by your principles, even when faced with social pressure."},{"day":342,"quote":"No one is more hated than he who speaks the truth.","author":"Plato","explanation":"Be prepared for social friction if you commit to living an honest, value-driven life. Not everyone wants to hear the truth."},{"day":343,"quote":"Interpersonal effectiveness skills are for achieving one's objectives in a way that maintains relationships and self-respect.","author":"Marsha M. Linehan","explanation":"The founder of DBT defines a core skill set: how to get what you want, keep relationships, and like yourself afterwards."},{"day":344,"quote":"He who is unable to live in society, or who has no need because he is sufficient for himself, must be either a beast or a god.","author":"Aristotle","explanation":"To be human is to be a social creature. Our nature as a species requires us to live and act within a community."},{"day":345,"quote":"If you would be a leader of men, you must lead your own mind.","author":"Lao Tzu","explanation":"This Eastern wisdom aligns with the Western principle that effective and virtuous influence in society begins with self-mastery."},{"day":346,"quote":"People will do anything, no matter how absurd, in order to avoid facing their own souls.","author":"Carl Jung","explanation":"A foundational insight of depth psychology: we often engage in distraction and avoidance to escape difficult self-reflection."},{"day":347,"quote":"He who has conferred a kindness should be silent; he who has received one should speak of it.","author":"Seneca","explanation":"Practice generosity without seeking recognition, and practice gratitude by acknowledging the help you receive."},{"day":348,"quote":"All that is mine I carry with me.","author":"Bias of Priene","explanation":"The only true possessions are your character and wisdom. These are the things you carry with you in all circumstances."},{"day":349,"quote":"Nothing is more honorable than a grateful heart.","author":"Seneca","explanation":"Gratitude is a cornerstone of a virtuous character and a peaceful, prosocial life."},{"day":350,"quote":"It is a characteristic of a wise man not to do what he has to do, but to do what he ought to do.","author":"Seneca","explanation":"Virtue often requires choosing the right, value-driven path, not just the necessary or easy one."},{"day":351,"quote":"A man's character is his guardian divinity.","author":"Heraclitus","explanation":"Your cultivated character is the ultimate force that protects and guides you through life."},{"day":352,"quote":"It is a mark of a good man to delight in good deeds.","author":"Seneca","explanation":"A virtuous person finds genuine joy in acting for the benefit of others, seeing it as a natural expression of their character."},{"day":353,"quote":"When you are silent, it is not a sign of weakness, but of strength.","author":"Seneca","explanation":"The discipline to hold your tongue, to listen, and to not react emotionally is a key strength in social interactions."},{"day":354,"quote":"The best answer to anger is silence.","author":"Marcus Aurelius","explanation":"Responding to an angry person with silence refuses to fuel the fire and preserves your own tranquility."},{"day":355,"quote":"The greatest remedy for anger is delay.","author":"Seneca","explanation":"When you feel anger rising, create a space of time before you react. This allows reason to reassert itself over passion."},{"day":356,"quote":"Look for the good in people, not the bad.","author":"Marcus Aurelius","explanation":"A virtuous mindset actively seeks to find the positive aspects of others, fostering a more compassionate and harmonious social life."},{"day":357,"quote":"A man should be upright, not be kept upright.","author":"Marcus Aurelius","explanation":"True virtue is internal. Your good character should come from your own principles, not from external pressure or the fear of being caught."},{"day":358,"quote":"It is a great man that can be both humble and great.","author":"Seneca","explanation":"The highest form of character combines personal excellence with a humble recognition of one's place in the larger community."},{"day":359,"quote":"The first duty of a man is to be true to himself.","author":"Seneca","explanation":"Before you can be of service to others, you must first live in accordance with your own rational nature and principles."},{"day":360,"quote":"A man who is a friend to himself is a friend to all.","author":"Seneca","explanation":"When you have cultivated inner peace and virtue, you are able to engage with all of society from a place of stability and goodwill."},{"day":361,"quote":"No one can live a happy life, or even a supportable life, without the study of wisdom.","author":"Seneca","explanation":"A commitment to philosophical practice is not a hobby, but an essential requirement for navigating life successfully."},{"day":362,"quote":"The good man is a friend to all, and an enemy to none.","author":"Seneca","explanation":"A person of virtue approaches everyone with goodwill, even those who act wrongly, seeing them as mistaken rather than as enemies."},{"day":363,"quote":"He who is good is happy.","author":"Seneca","explanation":"This is the core Stoic equation: happiness is not an external goal to be pursued, but the natural consequence of a virtuous character."},{"day":364,"quote":"The mind is the ruler of the soul.","author":"Zeno of Citium","explanation":"Your rational faculty is the governing part of your being; it must be trained to direct your impulses and choices."},{"day":365,"quote":"All things are parts of one single system, which is called Nature; the individual life is good when it is in harmony with Nature.","author":"Zeno of Citium","explanation":"The ultimate goal is to align your personal will and actions with the rational, cosmic order of the universe."},{"day":366,"quote":"Accepting reality is the only way to live a life that is not full of suffering.","author":"Marsha M. Linehan","explanation":"A direct quote on the power of radical acceptance from the creator of DBT, summarizing a principle that is also deeply Stoic."}]}},"./JSON/Content_Reflections.json":{"reflection_prompts":[{"day":1,"theme":"Beginnings & Intentions","prompt":"What is one core intention you want to set for yourself this year? Why does this intention matter to you right now?"},{"day":2,"theme":"Self-Awareness","prompt":"When did you feel most like your true self today? What were you doing, and who were you with?" ur 'inner critic' saying to you lately? Do you have to believe it?"},{"day":67,"theme":"Growth & Learning","prompt":"How has your definition of happiness changed over time?"},{"day":68,"theme":"Values & Purpose","prompt":"What does a 'meaningful life' mean to you in this current chapter of your life?"},{"day":69,"theme":"Relationships & Connection","prompt":"Who in your life brings out the best in you? What qualities do they bring out?"},{"day":70,"theme":"Mindfulness & Presence","prompt":"When you think about the future, what physical sensations arise in your body?"},{"day":71,"theme":"Gratitude & Appreciation","prompt":"What is one freedom you have that you often take for granted?"},{"day":72,"theme":"Resilience & Strength","prompt":"Describe a time you had to adapt to an unexpected change. What did you learn?"},{"day":73,"theme":"Action & Intention","prompt":"What is one healthy habit you could start tomorrow that requires less than 5 minutes?"},{"day":74,"theme":"Self-Awareness","prompt":"When are you most likely to be hard on yourself?"},{"day":75,"theme":"Growth & Learning","prompt":"What is one area where you've noticed significant personal growth recently?"},{"day":76,"theme":"Values & Purpose","prompt":"What are you willing to struggle for?"},{"day":77,"theme":"Relationships & Connection","prompt":"Is there forgiveness you need to offer, either to someone else or to yourself?"},{"day":78,"theme":"Mindfulness & Presence","prompt":"Notice your posture right now. What might it say about your current state of mind?"},{"day":79,"theme":"Gratitude & Appreciation","prompt":"What is one piece of art (a song, a painting, a poem) that you are grateful exists?"},{"day":80,"theme":"Resilience & Strength","prompt":"When you feel overwhelmed, what is one reliable strategy that helps you regain your footing?"},{"day":81,"theme":"Action & Intention","prompt":"What is one email or text you can send right now to strengthen a connection?"},{"day":82,"theme":"Self-Awareness","                     // Variable Extraction: Mask strings to avoid false positives (e.g. 'Variety')
                    const reStrings = /"[^"]*"|'[^']*'/g;
                    const maskedProc = proc.replace(reStrings, '""');
                    const vars = [...new Set([...maskedProc.matchAll(reIdentifiers)].map(m => m[0]).filter(id => !reKeywords.test(id) && isNaN(id) && !reLiterals.test(id)))];

                    cached = { ast: parseExpr(proc), vars };
                    evalCache.set(expression, cached);
                }

                const env = new Map(); cached.vars.forEach(v => { if (!scores.has(v)) throw new ReferenceError(v); env.set(v, scores.get(v)); });
                return sanitizeResult(runExpr(cached.ast, env, helpers));
            };

            return { processAndSaveResults, calculateResults, pickBand };
        })();
        
        NoodleNudge.SettingsManager = (() => { let pendingReset = false; let pendingResetTimer = null;
            const exportData = async () => { try { const s = NoodleNudge.State.get(); const stateToExport = { app: 'noodle-nudge', appVersion: MasterBlueprint.version, schemaVersion: NoodleNudge.Schema.current, exportedAt: new Date().toISOString(), data: { userAnswers: s.userAnswers, userResults: s.userResults, userHistory: s.userHistory, settings: s.settings, appConfig: s.appConfig } }; const dataStr = JSON.stringify(stateToExport, null, 2); const blob = new Blob([dataStr], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `noodlenudge-backup-${NoodleNudge.Utils.localDate()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); NoodleNudge.UI.showToast('Backup saved to your downloads folder. It is not encrypted, so keep it somewhere private.', 'success'); } catch(err) { NoodleNudge.Logger.error("Export failed:", err); NoodleNudge.UI.showToast('Export failed. Your data on this device is unchanged. Try again, or reload the page.', 'danger'); } };
            const importData = (event) => { const file = event.target.files[0]; if (!file) return; if (!file.name.toLowerCase().endsWith('.json')) { NoodleNudge.UI.showToast('Import failed: choose a .json backup file. Nothing changed.', 'danger'); event.target.value = ''; return; } if (file.size > 2 * 1024 * 1024) { NoodleNudge.UI.showToast('Import failed: the file is over 2 MB. Nothing changed.', 'danger'); event.target.value = ''; return; } const reader = new FileReader(); reader.onload = async (e) => { try { let data = JSON.parse(e.target.result); let fromEnvelope = false; if (data && data.app === 'noodle-nudge' && data.data && typeof data.data === 'object') { NoodleNudge.Schema.migrate(data, NoodleNudge.Schema.check(data.schemaVersion)); if (Object.keys(data).some(k => !['app', 'appVersion', 'schemaVersion', 'exportedAt', 'data'].includes(k))) throw new Error('Invalid backup: Unexpected top-level fields.'); data = data.data; fromEnvelope = true; } const required = fromEnvelope ? ['userAnswers', 'userResults', 'appConfig'] : ['assessments', 'dailyContent', 'userAnswers', 'userResults', 'appConfig']; const allowed = new Set([...required, 'userHistory', 'settings', 'viewDate', 'debugLog']); const unexpected = Object.keys(data).filter(k => !allowed.has(k)); if (unexpected.length > 0) throw new Error('Invalid backup: Unexpected keys.'); const missing = required.filter(k => !(k in data)); if (missing.length > 0) throw new Error('Invalid backup: Missing keys.'); const isObject = (o) => o && typeof o === 'object' && !Array.isArray(o); const hasUnsafeKeys = (input) => { const queue = [input]; while (queue.length > 0) { const current = queue.pop(); if (!isObject(current) && !Array.isArray(current)) continue; for (const key of Object.keys(current)) { if (key === '__proto__' || key === 'prototype' || key === 'constructor') return true; const value = current[key]; if (isObject(value) || Array.isArray(value)) queue.push(value); } } return false; }; if (!fromEnvelope && !isObject(data.assessments)) throw new Error('Invalid assessments structure.'); if (!fromEnvelope && !isObject(data.dailyContent)) throw new Error('Invalid dailyContent structure.'); if (!isObject(data.userAnswers)) throw new Error('Invalid userAnswers structure.'); if (!isObject(data.userResults)) throw new Error('Invalid userResults structure.'); if (!isObject(data.appConfig)) throw new Error('Invalid appConfig structure.'); if (data.userHistory && !isObject(data.userHistory)) throw new Error('Invalid userHistory structure.'); if (hasUnsafeKeys(data)) throw new Error('Invalid backup: Unsafe key detected.'); if (!data.userHistory) data.userHistory = {}; const { assessments, dailyContent, debugLog, ...persistentData } = data; await NoodleNudge.DB.set('appState', persistentData); try { sessionStorage.setItem('nn.flash', 'Data imported.'); } catch (e) {} NoodleNudge.UI.showToast('Data imported and saved on this device. The page will now reload.', 'success'); setTimeout(() => window.location.reload(), 1500); } catch (error) { NoodleNudge.Logger.error('Import failed:', error); NoodleNudge.UI.showToast('Import failed: ' + error.message + ' Nothing changed.', 'danger'); event.target.value = ''; } }; reader.readAsText(file); };
            const resetData = () => { if (!pendingReset) { pendingReset = true; if (pendingResetTimer) clearTimeout(pendingResetTimer); NoodleNudge.UI.showToast('Nothing deleted yet. Press Delete all again within 10 s.', 'warning'); const rb = document.getElementById('reset-btn'); const rb0 = rb ? rb.textContent : ''; if (rb) { rb.textContent = 'Press again to delete everything'; rb.classList.add('armed'); if (!document.getElementById('reset-armnote')) { const an = document.createElement('p'); an.id = 'reset-armnote'; an.className = 'nn-armnote nn-small'; an.setAttribute('role', 'status'); an.textContent = 'Press again within 10 s to delete everything. Otherwise nothing is deleted.'; (rb.closest('.nn-acts') || rb).after(an); } } pendingResetTimer = setTimeout(() => { pendingReset = false; if (rb) { rb.textContent = rb0; rb.classList.remove('armed'); const an = document.getElementById('reset-armnote'); if (an) an.remove(); } }, 10000); return; } pendingReset = false; if (pendingResetTimer) clearTimeout(pendingResetTimer); NoodleNudge.UI.showLoader(); NoodleNudge.DB.clear().then(() => { try { localStorage.removeItem('nn.jlock'); } catch (e) {} NoodleNudge.UI.showToast('All data deleted from this device. The page will now reload.', 'success'); setTimeout(() => window.location.reload(), 1500); }).catch(err => { NoodleNudge.Logger.error("Reset failed:", err); NoodleNudge.UI.showToast('Delete did not finish. Some data may remain. Reload the page and try again.', 'danger'); NoodleNudge.UI.hideLoader(); }); };
            const fillWithRandomData = () => {
                if (!MasterBlueprint.featureFlags.enableDebugPanel) { NoodleNudge.Logger.warn("Debug panel disabled. Action ignored."); return; }
                NoodleNudge.Logger.info("Filling all assessments with random data.");
                const state = NoodleNudge.State.get();
                const newUserResults = { ...state.userResults };
                const newUserAnswers = { ...state.userAnswers }; const newUserHistory = { ...(state.userHistory || {}) };
                for (const assessmentId in state.assessments) {
                    const assessment = state.assessments[assessmentId];
                    const randomAnswers = {};
                    const interactionType = assessment.interactionType || 'likertScale';
                    if (interactionType === 'likertScale') {
                        assessment.questions.forEach(q => { const scale = assessment.responseScale; randomAnswers[q.id] = scale[Math.floor(Math.random() * scale.length)].value; });
                    } else if (interactionType === 'cardSort') {
                        assessment.sections.forEach(s => {
                            randomAnswers[s.id] = {};
                            const shuffledItems = [...s.items].sort(() => 0.5 - Math.random());
                            s.categories.forEach(cat => {
                                randomAnswers[s.id][cat.id] = [];
                                const limit = cat.limit === null ? Math.floor(shuffledItems.length / s.categories.length) : cat.limit;
                                while (randomAnswers[s.id][cat.id].length < limit && shuffledItems.length > 0) { randomAnswers[s.id][cat.id].push(shuffledItems.pop().id); }
                            });
                        });
                    }
                    const results = NoodleNudge.Scoring.calculateResults(assessment, randomAnswers);
                    newUserResults[assessmentId] = results;
                    newUserAnswers[assessmentId] = { answers: randomAnswers, timestamp: new Date().toISOString() };
                    const history = NoodleNudge.State.get().userHistory || {};
                    if (!history[assessmentId]) history[assessmentId] = [];
                    history[assessmentId].push({ timestamp: new Date().toISOString(), results, answers: randomAnswers });
                    newUserHistory[assessmentId] = history[assessmentId];
                }
                NoodleNudge.State.set({ userResults: newUserResults, userAnswers: newUserAnswers, userHistory: newUserHistory });
                NoodleNudge.UI.showToast('All assessments filled with random data.', 'success');
                NoodleNudge.App.navigate('assessments');
            };
        return { exportData, importData, resetData, fillWithRandomData }; })();
        
        NoodleNudge.App = (() => {
            const routes = { dashboard: NoodleNudge.UI.DashboardView, assessments: NoodleNudge.UI.AssessmentsView, assessment: (p) => NoodleNudge.UI.AssessmentTakerView(p.id), results: (p) => NoodleNudge.UI.ResultsView(p.id), journal: (p) => NoodleNudge.UI.JournalView(p || {}), settings: NoodleNudge.UI.SettingsView, licences: NoodleNudge.UI.LicencesView };
            const navigate = (path, params = {}, quiet = false) => {
                window.scrollTo(0, 0);
                const viewFn = routes[path];
                if (typeof viewFn === 'function') {
                    NoodleNudge.Logger.info(`Navigating to ${path}`);
                    viewFn(params);
                    const appRoot = document.getElementById('app-root');
                    NoodleNudge.UI.syncLock();
                    if (!quiet) {
                        const heading = appRoot.querySelector('h1, h2');
                        if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus(); }
                        else { appRoot.focus(); }
                    }
                } else {
                    NoodleNudge.Logger.error(`Route not found: ${path}`);
                }
            };
            const handleAction = (e) => { const target = e.target.closest('[data-action]'); if (!target) return; e.preventDefault(); let { viewDate } = NoodleNudge.State.get(); let newDate = new Date(viewDate); if (target.dataset.action === 'prev-day') { newDate.setDate(newDate.getDate() - 1); } else if (target.dataset.action === 'next-day') { newDate.setDate(newDate.getDate() + 1); } else if (target.dataset.action === 'today') { newDate = new Date(); } NoodleNudge.State.set({ viewDate: newDate.toISOString() }); /* Optimized: navigate('dashboard') removed to prevent double-render */ };
            const handleDebugAction = (e) => { const target = e.target.closest('[data-debug-action]'); if (!target) return; e.preventDefault(); const action = target.dataset.debugAction; if (action === 'force-reload') NoodleNudge.Content.loadAllContent(); else if (action === 'clear-state') NoodleNudge.SettingsManager.resetData(); else if (action === 'toast-success') NoodleNudge.UI.showToast('This is a success test.', 'success'); else if (action === 'toast-danger') NoodleNudge.UI.showToast('This is a danger test.', 'danger'); else if (action === 'fill-random') NoodleNudge.SettingsManager.fillWithRandomData(); };
            const handleNav = (e) => { const target = e.target.closest('[data-nav]'); if (!target) return; e.preventDefault(); navigate(target.dataset.nav, { id: target.dataset.assessmentId }); };
            const moveCard = (c) => { const sec=c.closest('.card-sort-section');const ctrs=[sec.querySelector('.card-sort-source'),...sec.querySelectorAll('.card-sort-target')];let i=(ctrs.indexOf(c.parentElement)+1)%ctrs.length;while(i!==ctrs.indexOf(c.parentElement)){const d=ctrs[i];const l=d.classList.contains('card-sort-source')?Infinity:(parseInt(d.dataset.limit)||Infinity);if(d.children.length-1<l){d.appendChild(c);c.focus();const h=d.querySelector('h4');const targetName=h?h.childNodes[0].textContent.trim():'Target';NoodleNudge.UI.showToast(`Moved to ${targetName}.`,'success');break;}i=(i+1)%ctrs.length;} };
            const setupEventListeners = () => {  document.body.addEventListener('click', (e) => { handleNav(e); handleAction(e); handleDebugAction(e); if(e.target.closest('.sortable-card')){e.preventDefault();moveCard(e.target.closest('.sortable-card'));} }); document.body.addEventListener('keydown', (e) => { if((e.key==='Enter'||e.key===' ')&&e.target.matches('.sortable-card')){e.preventDefault();moveCard(e.target);} }); };
            const openFromHash = () => { const n = NoodleNudge.Journal.hashPromptId(window.location.hash); if (!n) return; try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) {} navigate('journal', { prompt: n }); };
            window.addEventListener('hashchange', openFromHash);
            const init = async () => { try {
                NoodleNudge.Logger.info("Initializing NoodleNudge PWA...");
                NoodleNudge.UI.showLoader();
                let savedState = null;
                try { savedState = await NoodleNudge.DB.get('appState'); } catch (e) { NoodleNudge.Logger.error("Storage unavailable:", e); NoodleNudge.UI.showToast("This browser is not letting the app save data. You can read entries, but answers will be lost when you close this tab.", "warning"); }
                if (savedState) {
                    let finalState = JSON.parse(JSON.stringify(MasterBlueprint.stateSchema));
                    for (const key in finalState) {
                        if (savedState.hasOwnProperty(key) && key !== 'viewDate') {
                            if (key === 'appConfig') {
                                finalState[key] = { ...finalState[key], ...savedState[key] };
                            } else {
                                finalState[key] = savedState[key];
                            }
                        }
                    }
                    finalState.appConfig.version = MasterBlueprint.stateSchema.appConfig.version;
                    finalState.viewDate = new Date().toISOString();
                    NoodleNudge.State.init(finalState);
                    NoodleNudge.Logger.info("State loaded from IndexedDB and merged with current schema.");
                } else {
                    NoodleNudge.State.init(MasterBlueprint.stateSchema);
                    NoodleNudge.Logger.info("Initialized with fresh state schema.");
                }
                setupEventListeners();
                NoodleNudge.Journal.init();
                /* Settings enabled */
                const currentState = NoodleNudge.State.get();
                if (!currentState.assessments || Object.keys(currentState.assessments).length === 0 || NoodleNudge.Content.stale(currentState.assessments)) { NoodleNudge.Logger.info("Loading embedded content..."); NoodleNudge.Content.loadAllContent(); } else { NoodleNudge.Logger.info("Content already available in state."); }
                navigate('dashboard', {}, true); openFromHash(); { const lbn = document.getElementById('nn-lockbtn'); if (lbn) lbn.addEventListener('click', () => { NoodleNudge.Journal.lockSafe('manual'); }); }
                                NoodleNudge.UI.hideLoader(); try { const f = sessionStorage.getItem('nn.flash'); if (f) { sessionStorage.removeItem('nn.flash'); NoodleNudge.UI.showToast(f, 'success'); } } catch (e) {}
                const vEl = document.getElementById("app-version"); if(vEl) vEl.textContent = MasterBlueprint.version; const cEl = document.getElementById("content-version"); if(cEl) { const cm = NoodleNudge.Content.meta(); cEl.textContent = cm.dataVersion + ", " + cm.date; } NoodleNudge.Logger.info("NoodleNudge initialization complete."); } catch (e) { NoodleNudge.Logger.error("Init failed:", e); NoodleNudge.UI.hideLoader(); NoodleNudge.UI.showToast("NoodleNudge could not start. Your saved data has not been touched. Reload the page to try again.", "danger"); }
            };
            return { init, navigate };
        })();
        
        document.addEventListener('DOMContentLoaded', NoodleNudge.App.init);
    </script>
