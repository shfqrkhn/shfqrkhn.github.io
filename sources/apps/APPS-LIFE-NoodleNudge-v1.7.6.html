/* NoodleNudge: app colour variables follow the kit tokens (looks and accent hue come from the kit). */
:root{--surface:var(--card);--ink:var(--fg);--muted:var(--mut);--edge:color-mix(in srgb,var(--fg) 55%,var(--bg));
--accent:var(--acc);--accent-ink:var(--on-acc);--focus:var(--acc);--danger:#A12F26;--success:#2D6A3E;--warning:#845300;
--fs-s:1rem;--fs-b:1rem;--fs-m:1.25rem;--fs-l:1.75rem;--fs-xl:3.5rem;
--s6:32px;--s7:48px;--s8:72px;
--r-ctl:8px;--pop-shadow:0 6px 18px rgba(0,0,0,.18);--r-sheet:var(--r);--dur:140ms;--ease:cubic-bezier(.2,.7,.2,1);

html[data-theme="charcoal"],html[data-theme="black"]{--danger:#F08A7E;--success:#7FC08F;--warning:#E0B04A}
@media (prefers-color-scheme:dark){html:not([data-theme]){--danger:#F08A7E;--success:#7FC08F;--warning:#E0B04A}}
html{scroll-padding-bottom:6rem;scrollbar-gutter:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-wrap:break-word}
h1,h2,h3,h4,p,ul,ol,figure,fieldset{margin:0;padding:0}
ul,ol{list-style:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.2;text-wrap:balance}
p{text-wrap:pretty}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
a:hover{text-decoration-thickness:2px}
h1[tabindex],h2[tabindex],main[tabindex]{outline:none}
.nn-vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* top strip */
.nn-strip{background:var(--surface);border-bottom:1px solid var(--line)}
.nn-strip-in{max-width:70rem;margin:0 auto;padding:0 var(--s4)}
.ic{width:1.2em;height:1.2em;flex:none;fill:currentColor}
.nn-nav a{gap:6px}
/* page chrome */
.nn-brand{font-family:var(--serif);font-size:clamp(1.25rem,4.5vw,1.6rem);font-weight:500;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;margin:0 auto 0 var(--s1);overflow-wrap:anywhere}
.ph{flex-wrap:wrap}
.ph .aic{width:28px;height:28px}
@media (max-width:419px){.ph{gap:var(--s1)}}
@media (max-width:359px){.ph .aic{display:none}.nn-brand{font-size:1.1rem}}
.nn-nav{display:flex;flex-wrap:wrap;gap:0 var(--s4)}
@media (min-width:36rem){.nn-nav{column-gap:var(--s5)}}
.nn-nav a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink)}
.nn-nav a:hover{text-decoration:underline;text-decoration-thickness:1px}
.nn-nav a.active{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:.35em}
select,input[type=file]{font:inherit;font-size:var(--fs-s)}
select{min-height:44px;padding:0 var(--s3);background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-ctl)}
/* page */
main{flex:1;width:100%;max-width:70rem;margin:0 auto;padding:var(--s6) var(--s4) var(--s7)}
main:focus{outline:none}
h1[tabindex],h2[tabindex],main[tabindex]{outline:none}
.nn-sheet{display:grid;grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sheet)}
.nn-margin{padding:var(--s5) var(--s5) var(--s4);display:flex;flex-direction:column;gap:var(--s4);border-bottom:1px solid var(--line)}
.nn-body{padding:var(--s5) var(--s5) var(--s6);display:flex;flex-direction:column;gap:var(--s6);min-width:0}
@media (min-width:56rem){
 .nn-sheet{grid-template-columns:17rem minmax(0,1fr);min-height:30rem}
 .nn-margin{border-bottom:0;border-right:1px solid var(--line);padding:var(--s6) var(--s5)}
 .nn-body{padding:var(--s6) var(--s7) var(--s7) var(--s7)}
}
h1.nn-title{font-size:var(--fs-l);line-height:1.15}
.nn-note{color:var(--muted)}
.nn-small{font-size:var(--fs-s)}
/* running head */
.nn-date{display:flex;flex-direction:column;font-family:var(--serif);font-weight:500}
.nn-wd{font-size:var(--fs-m);line-height:1.2}
.nn-day{font-size:var(--fs-xl);line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums}
.nn-my{font-size:var(--fs-m);line-height:1.3;color:var(--muted)}
.nn-folio{font-size:var(--fs-s);color:var(--muted);font-variant-numeric:tabular-nums}
.nn-turn{display:flex;flex-wrap:wrap;gap:var(--s2)}
.nn-showday{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.nn-showday label{font-weight:600;font-size:var(--fs-s)}
.nn-showday input{font:inherit;font-size:var(--fs-s);color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-ctl);min-height:44px;width:5.5rem;padding:0 var(--s3)}
.nn-showday .nn-jerr{flex-basis:100%}
.nn-kinds{display:flex;flex-direction:row;flex-wrap:wrap;gap:0 var(--s5)}
@media (min-width:56rem){.nn-kinds{flex-direction:column;gap:0}}
.nn-kinds button{appearance:none;background:none;border:0;color:var(--ink);font:inherit;min-height:44px;padding:0;text-align:left;cursor:pointer;display:inline-flex;align-items:center}
.nn-kinds button span{text-decoration:none}
.nn-kinds button:hover span{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.nn-kinds button[aria-pressed=true] span{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:.35em}
.nn-kinds-h{font-size:var(--fs-s);color:var(--muted)}
/* entry */
.nn-entry{display:flex;flex-direction:column;gap:var(--s5);max-width:38rem;animation:nn-in 160ms ease-out}
@keyframes nn-in{from{opacity:0}to{opacity:1}}
.nn-entry-h{font-size:var(--fs-s);font-family:var(--sans);font-weight:600;color:var(--muted)}
.nn-prompt{font-family:var(--serif);font-size:var(--fs-l);line-height:1.4;text-wrap:balance}
.nn-quote{font-family:var(--serif);font-style:italic;font-size:var(--fs-l);line-height:1.4;text-wrap:balance}
.nn-by{color:var(--muted)}
.nn-theme{font-family:var(--serif);font-size:var(--fs-l);line-height:1.2}
.nn-text{font-family:var(--serif);font-size:var(--fs-m);line-height:1.6;max-width:36rem}
.nn-acts{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.nn-next{border-top:1px solid var(--line);padding-top:var(--s5);display:flex;flex-direction:column;gap:var(--s3);max-width:38rem}
.nn-next p{max-width:36rem}
/* buttons */
.nn-btn{appearance:none;font:inherit;font-weight:600;font-size:var(--fs-b);min-height:44px;min-width:44px;padding:var(--s2) var(--s4);border-radius:var(--r-ctl);border:1px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;line-height:1.25;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.nn-btn:hover{background:var(--bg)}
.nn-btn:active{background:var(--line)}
.nn-btn[disabled]{color:var(--muted);border:1px dashed var(--edge);cursor:not-allowed}
.nn-btn[disabled]:hover{background:transparent}
.nn-btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nn-btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
html[data-theme="paper"] .nn-btn-primary:hover{filter:brightness(.92)}
.nn-btn-primary:active{background:var(--accent);filter:brightness(.85)}
.nn-btn-danger{color:var(--danger);border-color:var(--danger)}
.nn-btn-danger.armed{background:var(--danger);color:var(--surface);outline:3px solid var(--danger);outline-offset:2px}
.nn-savebar.on{position:sticky;bottom:var(--s2)}
.nn-btn[hidden]{display:none}
.nn-lockbtn{min-height:44px}
.nn-writebox{display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}
.nn-draftslot{display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
.nn-draftslot:empty{display:none}
.nn-draftnote{font-weight:600}
.nn-armnote{color:var(--ink);font-weight:600;border-left:4px solid var(--danger);padding-left:var(--s3);max-width:36rem}
.nn-fold{border-top:1px solid var(--line);padding-top:var(--s3);max-width:40rem}
.nn-fold summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.nn-fold dt{font-weight:600;margin-top:var(--s3)}
.nn-fold dd{margin:0;color:var(--ink)}
.nn-sec ol{list-style:decimal;padding-left:1.5rem;display:flex;flex-direction:column;gap:var(--s2)}
.nn-sec h3{font-size:var(--fs-b);font-family:var(--sans);font-weight:600;margin-top:var(--s3)}
.nn-scale-note{color:var(--muted);font-size:var(--fs-s)}
/* lists (assessments) */
.nn-group{display:flex;flex-direction:column}
.nn-group>h2{font-size:var(--fs-m);margin-bottom:var(--s2)}
.nn-group>p{margin-bottom:var(--s3)}
.nn-rows{border-top:1px solid var(--line)}
.nn-row{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5);justify-content:space-between;align-items:center;padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.nn-row-t{flex:1 1 18rem;min-width:0;display:flex;flex-direction:column;gap:var(--s1)}
.nn-row-t h3{font-size:var(--fs-m)}
.nn-state{font-size:var(--fs-s);color:var(--muted)}
.nn-row-a{display:flex;gap:var(--s2);flex-wrap:wrap}
/* questions */
.nn-qs{display:flex;flex-direction:column}
.nn-q{border:0;border-top:1px solid var(--line);padding:var(--s5) 0;min-width:0}
.nn-q:first-child{border-top:0;padding-top:0}
.nn-q legend{float:left;width:100%;display:grid;grid-template-columns:2.25rem minmax(0,1fr);font-family:var(--serif);font-size:var(--fs-m);line-height:1.4;margin-bottom:var(--s3);padding:0}
.nn-q legend+*{clear:both}
.nn-qn{font-family:var(--sans);font-size:var(--fs-s);color:var(--muted);padding-top:.35em;font-variant-numeric:tabular-nums}
.nn-scale{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding-left:2.25rem}
@media (min-width:56rem){.nn-scale{grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);padding-left:2.25rem}}
.nn-opt{display:flex;align-items:center;gap:var(--s3);min-height:44px;padding:var(--s1) var(--s3);cursor:pointer;border-radius:var(--r-ctl);border:1px solid transparent;font-size:var(--fs-b);line-height:1.3}
.nn-opt:hover{background:var(--bg)}
.nn-opt input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;flex:none;border:2px solid var(--edge);border-radius:50%;background:var(--surface)}
.nn-opt input:checked{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
@media (forced-colors:active){.nn-opt input:checked{background:Highlight;border-color:Highlight}}
.nn-opt:has(input:checked){border-color:var(--edge);background:var(--bg)}
.nn-opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.nn-opt input:focus-visible{outline:none}
@media (min-width:56rem){.nn-opt{flex-direction:column;justify-content:flex-start;text-align:center;padding:var(--s3) var(--s2);gap:var(--s2);border-color:var(--line)}.nn-opt:has(input:checked){border-color:var(--ink)}}
.nn-progress{font-size:var(--fs-s);color:var(--muted);font-variant-numeric:tabular-nums}
.nn-savebar{position:static;margin:var(--s4) 0 0;padding:var(--s3) var(--s4);background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-ctl);font-size:var(--fs-s);font-weight:600;z-index:5}
.nn-foot{display:flex;flex-wrap:wrap;gap:var(--s3);justify-content:space-between;border-top:1px solid var(--line);padding-top:var(--s5)}
/* card sort */
.nn-sort{display:flex;flex-direction:column;gap:var(--s4);margin-bottom:var(--s6)}
.nn-sort h3{font-size:var(--fs-m)}
.nn-sort h4{font-family:var(--sans);font-size:var(--fs-b);font-weight:600;margin-bottom:var(--s2)}
.card-sort-source,.card-sort-target{border:1px dashed var(--edge);border-radius:var(--r-ctl);padding:var(--s3);margin-bottom:var(--s3);min-height:5rem}
.nn-badge{font-size:var(--fs-s);font-weight:400;color:var(--muted)}
.sortable-card{display:flex;align-items:center;min-height:44px;padding:var(--s2) var(--s3);margin-bottom:var(--s2);background:var(--bg);border:1px solid var(--edge);border-radius:var(--r-ctl);cursor:grab;user-select:none;touch-action:manipulation}
.sortable-card:active{cursor:grabbing}
.sortable-card.dragging{opacity:.5}
.sortable-card.selected{outline:3px solid var(--accent);outline-offset:2px}
.card-sort-target:focus-visible,.card-sort-source:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card-sort-target.drag-over{border-style:solid;border-color:var(--accent);background:var(--bg)}
/* results */
.nn-chart{position:relative;height:26rem;max-width:36rem}
.nn-score{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4) 0;border-top:1px solid var(--line);max-width:40rem}
.nn-score h2{font-size:var(--fs-m)}
.nn-score .nn-val{font-size:var(--fs-b);font-variant-numeric:tabular-nums}
.nn-score .nn-val b{font-weight:600}
/* settings */
.nn-sec{display:flex;flex-direction:column;gap:var(--s3);max-width:40rem}
.nn-sec h2{font-size:var(--fs-m)}
.nn-sec+.nn-sec{border-top:1px solid var(--line);padding-top:var(--s5)}
.nn-lic{display:flex;flex-direction:column;gap:var(--s4);max-width:40rem}
.nn-lic dt{font-weight:600}
.nn-lic dd{margin:0;color:var(--muted)}
details summary{min-height:44px;display:flex;align-items:center;cursor:pointer}
pre.nn-pre{white-space:pre-wrap;font-size:var(--fs-s);font-family:var(--sans);color:var(--muted);max-height:24rem;overflow:auto;border:1px solid var(--line);padding:var(--s3);border-radius:var(--r-ctl)}
.nn-empty{max-width:34rem;display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}

/* journal */
.nn-kinds button{min-width:44px}
.nn-field{display:flex;flex-direction:column;gap:var(--s2);max-width:38rem}
.nn-field label{font-weight:600;font-size:var(--fs-s)}
.nn-field input[type=text],.nn-field input[type=search],.nn-field input[type=password],.nn-field input[type=date],.nn-field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-ctl);padding:var(--s2) var(--s3);min-height:44px;width:100%;max-width:100%}
.nn-field input[type=date]{max-width:14rem}
.nn-jtext{font-family:var(--serif)!important;font-size:var(--fs-m)!important;line-height:1.6;min-height:16rem;resize:vertical}
.nn-jwrite,.nn-jform,.nn-jwrap,.nn-lock{display:flex;flex-direction:column;gap:var(--s5)}
.nn-jbody{display:flex;flex-direction:column;gap:var(--s5);min-width:0}
.nn-jprompt{border:1px solid var(--line);border-radius:var(--r-ctl);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);max-width:38rem}
.nn-jp-text{font-family:var(--serif);font-size:var(--fs-m);line-height:1.45}
.nn-jprompt-off{display:flex}
.nn-jstatus{color:var(--muted);min-height:1.5em}
.nn-jerr{color:var(--danger);font-weight:600}
.nn-jerr:empty{display:none}
.nn-jwarn{border:2px solid var(--warning);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);max-width:40rem}
.nn-check{display:flex;gap:var(--s3);align-items:flex-start;min-height:44px;padding:var(--s2) 0;cursor:pointer;max-width:38rem}
.nn-check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;margin:0;flex:none;border:2px solid var(--edge);border-radius:var(--r-ctl);background:var(--surface)}
.nn-check input:checked{background:var(--accent);border-color:var(--accent)}
.nn-check input:checked::after{content:"";display:block;width:6px;height:12px;margin:1px 0 0 7px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.nn-check:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.nn-check input:focus-visible{outline:none}
.nn-tagbar{display:flex;flex-wrap:wrap;gap:var(--s2)}
.nn-chip{appearance:none;font:inherit;font-size:var(--fs-s);min-height:44px;min-width:44px;padding:var(--s1) var(--s3);border:1px solid var(--edge);border-radius:var(--r-ctl);background:transparent;color:var(--ink);cursor:pointer}
.nn-chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.nn-jlist{display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:40rem}
.nn-jitem{padding:var(--s4) 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s2)}
.nn-jitem h3{font-family:var(--sans);font-size:var(--fs-b);font-weight:600}
.nn-jsnip{font-family:var(--serif);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;max-width:36rem}
.nn-jtags{font-size:var(--fs-s);color:var(--muted)}
.nn-calnav{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;max-width:40rem}
.nn-calnav h2{flex:1 1 8rem;text-align:center;color:var(--ink);font-size:var(--fs-m);font-family:var(--serif)}
.nn-cal{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s2);max-width:40rem}
.nn-calh,.nn-calblank{display:none}
.nn-calcell{appearance:none;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--edge);border-radius:var(--r-ctl);min-height:44px;padding:var(--s2) var(--s3);display:flex;align-items:center;gap:var(--s3);text-align:left;cursor:pointer}
.nn-calcell.has{background:var(--bg)}
.nn-calcell.today{border-width:2px;border-color:var(--accent)}
.nn-calcell[aria-pressed=true]{border-width:3px;border-color:var(--ink)}
.nn-cd{min-width:2ch;font-weight:600;font-variant-numeric:tabular-nums}
.nn-cw{font-size:var(--fs-s);color:var(--muted)}
.nn-cc{margin-left:auto;font-size:var(--fs-s);font-weight:600}
.nn-jday{display:flex;flex-direction:column;gap:var(--s4)}
@media (max-width:43.99rem){.nn-cal.nn-calfold .nn-calcell:not(.has):not(.today):not([aria-pressed=true]){display:none}}
@media (min-width:44rem){.nn-calall{display:none}}
.nn-jlockrow{display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
.nn-jlockrow:empty{display:none}
.nn-jform{scroll-margin-top:4.5rem}
@media (min-width:44rem){
 .nn-cal{grid-template-columns:repeat(7,minmax(0,1fr))}
 .nn-calh{display:block;text-align:center;font-size:var(--fs-s);color:var(--muted)}
 .nn-calblank{display:block}
 .nn-calcell{flex-direction:column;justify-content:center;align-items:center;min-height:64px;gap:0;padding:var(--s1)}
 .nn-cw{display:none}
 .nn-cc{margin:0;font-size:var(--fs-s)}
}

/* journal v1.7 */
.nn-jwarnx{border:2px solid var(--warning);border-radius:var(--r-ctl);padding:var(--s3) var(--s4);max-width:40rem}
.nn-field select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--edge);border-radius:var(--r-ctl);padding:var(--s2) var(--s3);min-height:44px;width:100%;max-width:24rem}
/* footer */
.nn-footer{border-top:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:var(--fs-s)}
.nn-footer-in{max-width:70rem;margin:0 auto;padding:var(--s4);display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);align-items:center}
.nn-footer p{margin-right:auto;max-width:44rem}
.nn-footer a{color:var(--ink);display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
/* loader and toasts */
#loader-overlay{position:fixed;inset:0;background:var(--bg);display:flex;justify-content:center;align-items:center;z-index:9999;color:var(--muted);font-family:var(--serif);font-size:var(--fs-m)}
#toast-container{position:fixed;left:var(--s2);right:var(--s2);bottom:calc(var(--s2) + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:28rem;z-index:10000;display:flex;flex-direction:column-reverse;gap:var(--s2);pointer-events:none}
body:has(.nn-savebar.on) #toast-container{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}
#toast-container .toast-body{pointer-events:none}
@media (min-width:36rem){#toast-container{left:auto;right:var(--s5);margin:0;width:22rem}}
.toast{pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--edge);border-radius:var(--r-ctl);box-shadow:var(--pop-shadow);display:flex;align-items:flex-start}
.toast:not(.show){display:none}
.toast.showing{opacity:0}
.toast{transition:opacity var(--dur) ease-out}
.toast .toast-body{padding:var(--s2) var(--s3);flex:1;min-width:0;align-self:center}
.toast-warning .toast-body,.toast-danger .toast-body{font-weight:600}
.toast-danger{border-color:var(--danger)}
.toast-success{border-color:var(--success)}
.toast-warning{border-color:var(--warning)}
.toast .btn-close{pointer-events:auto;appearance:none;background:none;border:0;color:var(--ink);font:inherit;font-size:var(--fs-s);min-width:44px;min-height:44px;cursor:pointer;text-decoration:underline}
.collapse:not(.show){display:none}

trol you feel over your life.","instructions":"Think about the last few months. How much do you agree with each statement?","scientificBasis":{"summary":"These are original statements written for this app. They are not a validated scale. Use the result as a prompt for reflection.","citation":"Original items written for this app."},"responseScale":[{"text":"Strongly Disagree","value":1},{"text":"Disagree","value":2},{"text":"Neither Agree nor Disagree","value":3},{"text":"Agree","value":4},{"text":"Strongly Agree","value":5}],"questions":[{"id":"cse_01","text":"I usually find a way to get things done.","scoring":{"dimension":"cse","isReversed":false}},{"id":"cse_02","text":"I often feel I have little say in what happens to me.","scoring":{"dimension":"cse","isReversed":true}},{"id":"cse_03","text":"I believe my effort makes a difference.","scoring":{"dimension":"cse","isReversed":false}},{"id":"cse_04","text":"When something goes wrong, I tend to doubt myself.","scoring":{"dimension":"cse","isReversed":true}},{"id":"cse_05","text":"I feel able to handle most problems that come up.","scoring":{"dimension":"cse","isReversed":false}},{"id":"cse_06","text":"I often feel stuck, with no good options.","scoring":{"dimension":"cse","isReversed":true}},{"id":"cse_07","text":"I am fairly happy with the way I am.","scoring":{"dimension":"cse","isReversed":false}},{"id":"cse_08","text":"I often think other people are more capable than me.","scoring":{"dimension":"cse","isReversed":true}},{"id":"cse_09","text":"I can shape how my days go.","scoring":{"dimension":"cse","isReversed":false}},{"id":"cse_10","text":"Setbacks make me want to give up.","scoring":{"dimension":"cse","isReversed":true}},{"id":"cse_11","text":"I trust my own judgement on most choices.","scoring":{"dimension":"cse","isReversed":false}},{"id":"cse_12","text":"I often feel that luck decides how things turn out for me.","scoring":{"dimension":"cse","isReversed":true}}],"scoringRubric":{"primaryScores":[{"id":"core_self_evaluation","title":"Sense of control and confidence","scaleNote":"higher means more confidence and control","calculation":"SUM_AND_AVERAGE([cse_01, cse_03, cse_05, cse_07, cse_09, cse_11], REVERSE_SCORE([cse_02, cse_04, cse_06, cse_08, cse_10, cse_12]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"You may doubt yourself or feel little control right now. Small steps can help, and feelings change."},{"label":"Average","range":[2.5,3.5],"description":"You feel fairly capable, with some doubt when things get hard."},{"label":"High","range":[3.51,5],"description":"You feel confident in yourself and in your power to shape your life."}]}],"derivativeInsights":[]},"sensitive":true,"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis.","supportLine":"If you feel unsafe or very low, please talk to a health professional or call your local crisis line."},"./JSON/Q4_Work%20Motivation.json":{"id":"work_motivation_v1.0.0","version":"1.0.0","tier":"Tier 1","title":"What Engages You","description":"Rate one activity you find engaging to see which features make it work for you.","instructions":"Pick one activity that engages you, at work or elsewhere. Think about the last few months. How much does it have each feature?","scientificBasis":{"summary":"This uses a well known model of what makes tasks motivating. Here it has one question per feature, so it is a rough guide only.","citation":"Based on a general job design model. Questions written for this app."},"responseScale":[{"text":"Very Little","value":1},{"text":"Somewhat","value":2},{"text":"A Moderate Amount","value":3},{"text":"A Lot","value":4},{"text":"A Great Deal","value":5}],"questions":[{"id":"mps_1","text":"How much variety does it have? For example, it uses many different skills.","scoring":{"dimension":"skillVariety"}},{"id":"mps_2","text":"How much of it do you see through from start to finish?","scoring":{"dimension":"taskIdentity"}},{"id":"mps_3","text":"How much does it matter to other people?","scoring":{"dimension":"taskSignificance"}},{"id":"mps_4","text":"How much freedom do you have in how you do it?","scoring":{"dimension":"autonomy"}},{"id":"mps_5","text":"How much does the activity itself show you how well you are doing?","scoring":{"dimension":"feedback"}}],"scoringRubric":{"primaryScores":[{"id":"motivating_potential_score","title":"Engagement score","calculation":"((skillVariety_score + taskIdentity_score + taskSignificance_score) / 3) * autonomy_score * feedback_score","interpretation":[{"label":"Low","range":[1,39],"description":"The activity you chose has few of the features that tend to keep people engaged."},{"label":"Average","range":[40,79],"description":"The activity you chose has a fair number of engaging features."},{"label":"High","range":[80,125],"description":"The activity you chose has many of the features that tend to engage people."}],"scaleNote":"higher means the activity has more engaging features"}],"derivativeInsights":[{"id":"key_career_drivers","title":"Features that stand out","replaces":[],"calculationLogic":"IDENTIFY_HIGHEST_SCORE_DIMENSIONS([skillVariety_score, taskIdentity_score, taskSignificance_score, autonomy_score, feedback_score], ['Variety', 'Completion', 'Impact', 'Freedom', 'Clarity'])","interpretation":{"Variety":"Variety stands out. You like using many different skills.","Completion":"Completion stands out. You like seeing a task through from start to end.","Impact":"Impact stands out. You like knowing your work matters to others.","Freedom":"Freedom stands out. You like choosing how you do things.","Clarity":"Clarity stands out. You like to see how well you are doing.","Balanced":"No one feature stands out. All five were rated the same."}}]},"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis."},"./JSON/Q5_Perceived%20Stress%20Scale%20(PSS).json":{"id":"pss_v1.0.0","version":"1.0.0","tier":"Tier 2","title":"Last Month Stress Check","description":"A quick look at how stressed you have felt over the last month.","instructions":"Think about the last month. How often have you felt or thought each of these?","scientificBasis":{"summary":"These are original questions written for this app. They are not a validated stress test, and the bands are simple thirds of the score range.","citation":"Original items written for this app."},"responseScale":[{"text":"Never","value":1},{"text":"Almost Never","value":2},{"text":"Sometimes","value":3},{"text":"Fairly Often","value":4},{"text":"Very Often","value":5}],"questions":[{"id":"pss_01","text":"In the last month, how often have you found your to-do list too long to finish?","scoring":{"dimension":"stress","isReversed":false}},{"id":"pss_02","text":"In the last month, how often have you felt tense or on edge?","scoring":{"dimension":"stress","isReversed":false}},{"id":"pss_03","text":"In the last month, how often have you been caught off guard by a change of plans?","scoring":{"dimension":"stress","isReversed":false}},{"id":"pss_04","text":"In the last month, how often have you felt sure you could handle your problems?","scoring":{"dimension":"stress","isReversed":true}},{"id":"pss_05","text":"In the last month, how often have you felt you had enough time for what matters?","scoring":{"dimension":"stress","isReversed":true}},{"id":"pss_06","text":"In the last month, how often have you stayed calm when something went wrong?","scoring":{"dimension":"stress","isReversed":true}},{"id":"pss_07","text":"In the last month, how often have you lost your temper over small things?","scoring":{"dimension":"stress","isReversed":false}},{"id":"pss_08","text":"In the last month, how often have you felt problems were growing faster than you could solve them?","scoring":{"dimension":"stress","isReversed":false}},{"id":"pss_09","text":"In the last month, how often have you felt in control of how you spend your days?","scoring":{"dimension":"stress","isReversed":true}},{"id":"pss_10","text":"In the last month, how often have you found it hard to switch off and relax?","scoring":{"dimension":"stress","isReversed":false}}],"scoringRubric":{"primaryScores":[{"id":"perceived_stress_score","title":"Stress score","scaleNote":"higher means more stress","calculation":"SUM([pss_01, pss_02, pss_03, pss_07, pss_08, pss_10], REVERSE_SCORE([pss_04, pss_05, pss_06, pss_09]))","interpretation":[{"label":"Lower","range":[10,23],"description":"You report lower stress this month. You seem to have room to cope with what comes up."},{"label":"Middle","range":[24,36],"description":"You report a middle level of stress. It may help to plan some rest."},{"label":"Higher","range":[37,50],"description":"You report higher stress this month. Consider what you can drop, share or delay, and talk with someone you trust."}]}]},"sensitive":true,"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis.","supportLine":"If you feel unsafe or very low, please talk to a health professional or call your local crisis line."},"./JSON/Q6_Conflict%20%26%20Negotiation%20Style.json":{"id":"conflict_style_v1.0.0","version":"1.0.0","tier":"Tier 2","title":"Conflict Style Reflection","description":"See which ways of handling a disagreement you use most often.","instructions":"Think about times you disagree with someone. How often do you do each of these?","scientificBasis":{"summary":"This is an original reflection exercise with five common ways to handle a disagreement. It is not a validated test. No style is best in every case.","citation":"Original items written for this app."},"responseScale":[{"text":"Never","value":1},{"text":"Rarely","value":2},{"text":"Sometimes","value":3},{"text":"Often","value":4},{"text":"Almost always","value":5}],"questions":[{"id":"con_01","text":"I push hard for my own way.","scoring":{"dimension":"competing","isReversed":false}},{"id":"con_02","text":"I let the other person have their way.","scoring":{"dimension":"accommodating","isReversed":false}},{"id":"con_03","text":"I look for a solution that works well for both of us.","scoring":{"dimension":"collaborating","isReversed":false}},{"id":"con_04","text":"I steer clear of the topic.","scoring":{"dimension":"avoiding","isReversed":false}},{"id":"con_05","text":"I suggest that we each give up a little.","scoring":{"dimension":"compromising","isReversed":false}},{"id":"con_06","text":"I try to win the argument.","scoring":{"dimension":"competing","isReversed":false}},{"id":"con_07","text":"I give in to keep things calm.","scoring":{"dimension":"accommodating","isReversed":false}},{"id":"con_08","text":"I ask questions to learn what the other person needs.","scoring":{"dimension":"collaborating","isReversed":false}},{"id":"con_09","text":"I put off the talk until later.","scoring":{"dimension":"avoiding","isReversed":false}},{"id":"con_10","text":"I look for a fair middle ground.","scoring":{"dimension":"compromising","isReversed":false}},{"id":"con_11","text":"I stand firm even when others object.","scoring":{"dimension":"competing","isReversed":false}},{"id":"con_12","text":"I put the other person's needs first.","scoring":{"dimension":"accommodating","isReversed":false}},{"id":"con_13","text":"I work with them to find a new option.","scoring":{"dimension":"collaborating","isReversed":false}},{"id":"con_14","text":"I act as if nothing is wrong.","scoring":{"dimension":"avoiding","isReversed":false}},{"id":"con_15","text":"I offer a trade to settle it.","scoring":{"dimension":"compromising","isReversed":false}}],"scoringRubric":{"primaryScores":[{"id":"competing_score","title":"Competing Style Score","calculation":"AVERAGE_SCORE([con_01, con_06, con_11])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom push for your own way."},{"label":"Average","range":[2.5,3.5],"description":"You push for your way when you think it is needed."},{"label":"High","range":[3.51,5],"description":"You often push for your own way. This can help in a rush, but it may strain close ties."}]},{"id":"accommodating_score","title":"Accommodating Style Score","calculation":"AVERAGE_SCORE([con_02, con_07, con_12])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom give way to others."},{"label":"Average","range":[2.5,3.5],"description":"You give way when it suits the moment."},{"label":"High","range":[3.51,5],"description":"You often give way to keep the peace. Check that your own needs are heard too."}]},{"id":"collaborating_score","title":"Collaborating Style Score","calculation":"AVERAGE_SCORE([con_03, con_08, con_13])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom work out shared answers."},{"label":"Average","range":[2.5,3.5],"description":"You work out shared answers when there is time."},{"label":"High","range":[3.51,5],"description":"You often look for answers that suit everyone. This takes time but builds trust."}]},{"id":"avoiding_score","title":"Avoiding Style Score","calculation":"AVERAGE_SCORE([con_04, con_09, con_14])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom steer clear of conflict."},{"label":"Average","range":[2.5,3.5],"description":"You steer clear of some topics and face others."},{"label":"High","range":[3.51,5],"description":"You often steer clear of conflict. This can help with small things, but big ones may need a talk."}]},{"id":"compromising_score","title":"Compromising Style Score","calculation":"AVERAGE_SCORE([con_05, con_10, con_15])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom meet in the middle."},{"label":"Average","range":[2.5,3.5],"description":"You meet in the middle when it is practical."},{"label":"High","range":[3.51,5],"description":"You often meet in the middle. This is quick and fair, but it may leave some needs unmet."}]},{"id":"dominant_style","title":"Your Most Used Style","calculation":"IDENTIFY_MAX_SCORE_DIMENSION('competing_score', 'accommodating_score', 'collaborating_score', 'avoiding_score', 'compromising_score')","interpretation":{"competing":"Your most used style is competing. You stand up for what you want. This helps in an urgent case but can strain ties.","accommodating":"Your most used style is accommodating. You put the other person first and keep the peace. Make sure your own needs are heard.","collaborating":"Your most used style is collaborating. You look for answers that suit everyone. This builds trust but takes time.","avoiding":"Your most used style is avoiding. You steer clear of conflict or delay it. This suits small matters, but big ones may need a talk.","compromising":"Your most used style is compromising. You meet in the middle. This is quick and fair, but it may not suit every case.","no clear style":"No one style stands out. You may use different styles in different situations."}}]},"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis."},"./JSON/Q7_Authentic%20%26%20Ethical%20Leadership.json":{"id":"authentic_ethical_leadership_v1.0.0","version":"1.0.0","tier":"Tier 2","title":"Leadership Style Reflection","description":"Twenty-five statements about how you lead or guide others, in work, family or groups.","instructions":"Think about times you lead or guide others, over the last few months. How much do you agree with each statement?","scientificBasis":{"summary":"These are original statements on five themes: self-knowledge, values, listening, openness and ethics. They are not a validated test.","citation":"Original items written for this app."},"responseScale":[{"text":"Strongly Disagree","value":1},{"text":"Disagree","value":2},{"text":"Neither Agree nor Disagree","value":3},{"text":"Agree","value":4},{"text":"Strongly Agree","value":5}],"questions":[{"id":"q_01","text":"I can name my main strengths.","scoring":{"dimension":"self_awareness","isReversed":false}},{"id":"q_02","text":"I do what I believe is right, even when it is hard.","scoring":{"dimension":"internalized_moral_perspective","isReversed":false}},{"id":"q_03","text":"I ask for views that differ from mine.","scoring":{"dimension":"balanced_processing","isReversed":false}},{"id":"q_04","text":"I tell people what I really think.","scoring":{"dimension":"relational_transparency","isReversed":false}},{"id":"q_05","text":"I treat people fairly.","scoring":{"dimension":"ethical_leadership","isReversed":false}},{"id":"q_06","text":"I know what drains my energy.","scoring":{"dimension":"self_awareness","isReversed":false}},{"id":"q_07","text":"My choices match the values I talk about.","scoring":{"dimension":"internalized_moral_perspective","isReversed":false}},{"id":"q_08","text":"I change my mind when I hear a good reason.","scoring":{"dimension":"balanced_processing","isReversed":false}},{"id":"q_09","text":"I admit it when I am wrong.","scoring":{"dimension":"relational_transparency","isReversed":false}},{"id":"q_10","text":"I speak up when something seems wrong.","scoring":{"dimension":"ethical_leadership","isReversed":false}},{"id":"q_11","text":"I know why I react the way I do.","scoring":{"dimension":"self_awareness","isReversed":false}},{"id":"q_12","text":"I stay true to my values under pressure.","scoring":{"dimension":"internalized_moral_perspective","isReversed":false}},{"id":"q_13","text":"I look at the facts before I decide.","scoring":{"dimension":"balanced_processing","isReversed":false}},{"id":"q_14","text":"I share how I feel when it matters.","scoring":{"dimension":"relational_transparency","isReversed":false}},{"id":"q_15","text":"I set a good example by how I act.","scoring":{"dimension":"ethical_leadership","isReversed":false}},{"id":"q_16","text":"I ask others how I come across.","scoring":{"dimension":"self_awareness","isReversed":false}},{"id":"q_17","text":"I go along with the group even when I disagree.","scoring":{"dimension":"internalized_moral_perspective","isReversed":true}},{"id":"q_18","text":"I stop listening once I have made up my mind.","scoring":{"dimension":"balanced_processing","isReversed":true}},{"id":"q_19","text":"I hide my real views to avoid trouble.","scoring":{"dimension":"relational_transparency","isReversed":true}},{"id":"q_20","text":"I ask what is the right thing to do before I decide.","scoring":{"dimension":"ethical_leadership","isReversed":false}},{"id":"q_21","text":"I would rather not hear about my weak spots.","scoring":{"dimension":"self_awareness","isReversed":true}},{"id":"q_22","text":"I keep my promises.","scoring":{"dimension":"internalized_moral_perspective","isReversed":false}},{"id":"q_23","text":"I give people time to say what they think.","scoring":{"dimension":"balanced_processing","isReversed":false}},{"id":"q_24","text":"I let people see the real me.","scoring":{"dimension":"relational_transparency","isReversed":false}},{"id":"q_25","text":"I will bend the rules if it helps me get results.","scoring":{"dimension":"ethical_leadership","isReversed":true}}],"scoringRubric":{"primaryScores":[{"id":"self_awareness","title":"Self-Awareness","calculation":"SUM_AND_AVERAGE([q_01, q_06, q_11, q_16], REVERSE_SCORE([q_21]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"You may not yet know your strengths and limits well. Asking for feedback can help."},{"label":"Average","range":[2.5,3.5],"description":"You know yourself fairly well, with some blind spots left."},{"label":"High","range":[3.51,5],"description":"You know your strengths, limits and triggers well."}]},{"id":"internalized_moral_perspective","title":"Living by Your Values","calculation":"SUM_AND_AVERAGE([q_02, q_07, q_12, q_22], REVERSE_SCORE([q_17]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"Outside pressure may sometimes steer your choices. Writing down your values can help."},{"label":"Average","range":[2.5,3.5],"description":"You usually act on your values, though pressure can sway you."},{"label":"High","range":[3.51,5],"description":"You act on your values, even when it is hard."}]},{"id":"balanced_processing","title":"Open-Minded Listening","calculation":"SUM_AND_AVERAGE([q_03, q_08, q_13, q_23], REVERSE_SCORE([q_18]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"You may sometimes decide before hearing others. Try asking one more view."},{"label":"Average","range":[2.5,3.5],"description":"You usually weigh other views, but you may favour your own at times."},{"label":"High","range":[3.51,5],"description":"You weigh other views and facts fairly before you decide."}]},{"id":"relational_transparency","title":"Being Open With Others","calculation":"SUM_AND_AVERAGE([q_04, q_09, q_14, q_24], REVERSE_SCORE([q_19]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"You may keep your real views to yourself. Sharing a little more can build trust."},{"label":"Average","range":[2.5,3.5],"description":"You share your views and feelings in many cases, but not all."},{"label":"High","range":[3.51,5],"description":"You are open and genuine with others, which builds trust."}]},{"id":"ethical_leadership","title":"Acting Ethically","calculation":"SUM_AND_AVERAGE([q_05, q_10, q_15, q_20], REVERSE_SCORE([q_25]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"There may be room to act on what you think is right more often."},{"label":"Average","range":[2.5,3.5],"description":"You often act ethically, though some situations may test you."},{"label":"High","range":[3.51,5],"description":"You act fairly and speak up when something is wrong."}]}]},"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis."},"./JSON/Q8_Assertiveness%20Profile.json":{"id":"assertiveness_profile_v1.0.0","version":"1.0.0","tier":"Tier 2","title":"Assertiveness Profile","description":"See how directly you tend to say what you think and need.","instructions":"Rate how well each statement describes you in general. There are no right or wrong answers.","scientificBasis":{"summary":"Ten statements come from the International Personality Item Pool, which is free to use. Five more were written for this app. Treat the result as a rough guide.","citation":"International Personality Item Pool (ipip.ori.org), public domain, plus original items."},"responseScale":[{"text":"Very Inaccurate","value":1},{"text":"Moderately Inaccurate","value":2},{"text":"Neither Accurate nor Inaccurate","value":3},{"text":"Moderately Accurate","value":4},{"text":"Very Accurate","value":5}],"questions":[{"id":"q_01","text":"I take charge of situations.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_02","text":"I have a strong personality.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_03","text":"I know how to captivate people.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_04","text":"I see myself as a good leader.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_05","text":"I can talk others into doing things.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_06","text":"I am the first to act.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_07","text":"I do not have an assertive personality.","scoring":{"dimension":"assertiveness","isReversed":true}},{"id":"q_08","text":"I lack the talent for influencing people.","scoring":{"dimension":"assertiveness","isReversed":true}},{"id":"q_09","text":"I wait for others to lead the way.","scoring":{"dimension":"assertiveness","isReversed":true}},{"id":"q_10","text":"I hold back my opinions.","scoring":{"dimension":"assertiveness","isReversed":true}},{"id":"q_11","text":"I freely express my opinions.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_12","text":"I am comfortable stating my needs clearly.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_13","text":"I can stand up for myself when necessary.","scoring":{"dimension":"assertiveness","isReversed":false}},{"id":"q_14","text":"I tend to let others make decisions for me.","scoring":{"dimension":"assertiveness","isReversed":true}},{"id":"q_15","text":"I find it easy to say 'no' to requests.","scoring":{"dimension":"assertiveness","isReversed":false}}],"scoringRubric":{"primaryScores":[{"id":"assertiveness","title":"Assertiveness","calculation":"SUM_AND_AVERAGE([q_01, q_02, q_03, q_04, q_05, q_06, q_11, q_12, q_13, q_15], REVERSE_SCORE([q_07, q_08, q_09, q_10, q_14]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"You tend to hold back and let others lead. Practising short, clear requests can help."},{"label":"Average","range":[2.5,3.5],"description":"You speak up when it matters and you also stay sensitive to others."},{"label":"High","range":[3.51,5],"description":"You speak up with confidence about your views, needs and limits."}]}]},"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis."},"./JSON/Q9_Power%20%26%20Influence%20Profile.json":{"id":"power_influence_v1.0.0","version":"1.0.0","tier":"Tier 2","title":"How You Influence Others","description":"See which ways of influencing people you use most.","instructions":"Think about how you get others to act, at work, at home or in groups. Look at the last few months. How well does each statement describe you?","scientificBasis":{"summary":"This uses five common sources of influence: rewards, pressure, position, expertise and being liked. The statements are original. This is not a validated test. No style is better than another.","citation":"Original items written for this app."},"responseScale":[{"text":"Very Inaccurate","value":1},{"text":"Moderately Inaccurate","value":2},{"text":"Neither Accurate nor Inaccurate","value":3},{"text":"Moderately Accurate","value":4},{"text":"Very Accurate","value":5}],"questions":[{"id":"q_01","text":"I praise people when they do well.","scoring":{"dimension":"reward_power","isReversed":false}},{"id":"q_02","text":"I remind people of the downsides if they do not act.","scoring":{"dimension":"coercive_power","isReversed":false}},{"id":"q_03","text":"People follow me because of my role.","scoring":{"dimension":"legitimate_power","isReversed":false}},{"id":"q_04","text":"People trust my advice because of what I know.","scoring":{"dimension":"expert_power","isReversed":false}},{"id":"q_05","text":"People follow my lead because they like me.","scoring":{"dimension":"referent_power","isReversed":false}},{"id":"q_06","text":"I offer something in return when I ask for help.","scoring":{"dimension":"reward_power","isReversed":false}},{"id":"q_07","text":"I use deadlines and penalties to get things done.","scoring":{"dimension":"coercive_power","isReversed":false}},{"id":"q_08","text":"I use my title or position to settle a question.","scoring":{"dimension":"legitimate_power","isReversed":false}},{"id":"q_09","text":"People ask me for help in my area of skill.","scoring":{"dimension":"expert_power","isReversed":false}},{"id":"q_10","text":"People copy how I do things.","scoring":{"dimension":"referent_power","isReversed":false}},{"id":"q_11","text":"I can open doors for people who help me.","scoring":{"dimension":"reward_power","isReversed":false}},{"id":"q_12","text":"I let people know there will be consequences.","scoring":{"dimension":"coercive_power","isReversed":false}},{"id":"q_13","text":"I point to rules or policy to get agreement.","scoring":{"dimension":"legitimate_power","isReversed":false}},{"id":"q_14","text":"I back up my views with facts and experience.","scoring":{"dimension":"expert_power","isReversed":false}},{"id":"q_15","text":"I build close bonds that make people want to help me.","scoring":{"dimension":"referent_power","isReversed":false}}],"scoringRubric":{"primaryScores":[{"id":"reward_power","title":"Rewards","calculation":"AVERAGE_SCORE([q_01, q_06, q_11])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom use rewards to influence people."},{"label":"Average","range":[2.5,3.5],"description":"You use rewards in some cases."},{"label":"High","range":[3.51,5],"description":"You often use praise, trades or chances to influence people."}]},{"id":"coercive_power","title":"Pressure","calculation":"AVERAGE_SCORE([q_02, q_07, q_12])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom use pressure or penalties."},{"label":"Average","range":[2.5,3.5],"description":"You use pressure in some cases."},{"label":"High","range":[3.51,5],"description":"You often use pressure or penalties. This may work fast but can cost goodwill."}]},{"id":"legitimate_power","title":"Position","calculation":"AVERAGE_SCORE([q_03, q_08, q_13])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom lean on your role or rules."},{"label":"Average","range":[2.5,3.5],"description":"You use your role or rules in some cases."},{"label":"High","range":[3.51,5],"description":"You often lean on your role or on rules to influence people."}]},{"id":"expert_power","title":"Expertise","calculation":"AVERAGE_SCORE([q_04, q_09, q_14])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom lean on what you know."},{"label":"Average","range":[2.5,3.5],"description":"You use your knowledge in some cases."},{"label":"High","range":[3.51,5],"description":"You often influence people through your knowledge and skill."}]},{"id":"referent_power","title":"Being Liked","calculation":"AVERAGE_SCORE([q_05, q_10, q_15])","interpretation":[{"label":"Low","range":[1,2.49],"description":"You seldom rely on personal bonds to influence people."},{"label":"Average","range":[2.5,3.5],"description":"You use personal bonds in some cases."},{"label":"High","range":[3.51,5],"description":"You often influence people through trust, liking and close bonds."}]}]},"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis."},"./JSON/Q10_Proactive%20Personality%20Scale.json":{"id":"proactive_personality_v1.0.0","version":"1.0.0","tier":"Tier 2","title":"Taking Initiative","description":"See how much you tend to start things and change what you do not like.","instructions":"Think about the last few months. How much do you agree with each statement?","scientificBasis":{"summary":"These are original statements about taking initiative. They are not a validated scale. Use the result as a prompt for reflection.","citation":"Original items written for this app."},"responseScale":[{"text":"Strongly Disagree","value":1},{"text":"Disagree","value":2},{"text":"Neither Agree nor Disagree","value":3},{"text":"Agree","value":4},{"text":"Strongly Agree","value":5}],"questions":[{"id":"q_01","text":"I look for ways to improve how things are done.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_02","text":"When I spot a problem, I act on it.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_03","text":"I wait for others to start new things.","scoring":{"dimension":"proactive_personality","isReversed":true}},{"id":"q_04","text":"I start projects without being asked.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_05","text":"I keep going when my first try does not work.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_06","text":"I would rather follow a set routine than try something new.","scoring":{"dimension":"proactive_personality","isReversed":true}},{"id":"q_07","text":"I notice chances that others miss.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_08","text":"I share new ideas, even when I am unsure.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_09","text":"I tend to accept things as they are.","scoring":{"dimension":"proactive_personality","isReversed":true}},{"id":"q_10","text":"I turn my ideas into action.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_11","text":"I enjoy taking the lead on a new task.","scoring":{"dimension":"proactive_personality","isReversed":false}},{"id":"q_12","text":"I leave problems alone unless someone asks me to fix them.","scoring":{"dimension":"proactive_personality","isReversed":true}}],"scoringRubric":{"primaryScores":[{"id":"proactive_personality","title":"Initiative Score","scaleNote":"higher means you take more initiative","calculation":"SUM_AND_AVERAGE([q_01, q_02, q_04, q_05, q_07, q_08, q_10, q_11], REVERSE_SCORE([q_03, q_06, q_09, q_12]))","interpretation":[{"label":"Low","range":[1,2.49],"description":"You tend to adapt to what happens and wait for a clear need. That can be a calm and steady way to work."},{"label":"Average","range":[2.5,3.5],"description":"You act on your own when it matters and also follow what is set."},{"label":"High","range":[3.51,5],"description":"You often act early, spot chances and start things yourself."}]}]},"rev":"2026-11-02","disclaimer":"This is a reflection tool, not a diagnosis."},"./JSON/Content_CognitiveBiases.json":{"cognitive_biases_and_fallacies":{"biases":[{"day":1,"bias":"Action bias","summary":"You want to do something instead of nothing, even if doing nothing might be better.","example":"A coach makes a change to the team even if it might not help them win."},{"day":2,"bias":"Additive bias","summary":"You like to add things to make something better, even if taking things away works better.","example":"Instead of removing bad parts of a story, you add more details."},{"day":3,"bias":"Affect heuristic","summary":"Your feelings influence your decisions.","example":"You might like a product because it makes you feel good, not because it's the best."},{"day":4,"bias":"Ambiguity bias","summary":"You avoid choices when you don't know all the information.","example":"You might pick an investment with clear risks over one with unclear risks, even if it could pay more."},{"day":5,"bias":"Anchoring bias","summary":"You rely too much on the first piece of information you hear.","example":"If someone first says a price is $100, you'll think a price of $80 is a good deal."},{"day":6,"bias":"Attentional bias","summary":"You notice things that you are already thinking about a lot.","example":"If you are worried about spiders, you might notice them more often."},{"day":7,"bias":"Automation bias","summary":"You trust automated systems too much, even when they are wrong.","example":"A pilot might rely on a computer system even when their own senses tell them something is wrong."},{"day":8,"bias":"Availability heuristic","summary":"You guess how likely something is based on how easily you can think of examples.","example":"You might think plane crashes are common because you see them on the news."},{"day":9,"bias":"Bike-shedding effect","summary":"You spend too much time on small, unimportant details.","example":"A group might argue a lot about the color of a logo instead of the main plan."},{"day":10,"bias":"Cashless effect","summary":"You spend more money when using cards than when using cash.","example":"You might buy more things when paying with a credit card."},{"day":11,"bias":"Commitment bias","summary":"You stick to your past beliefs even when new facts show they are wrong.","example":"An investor might keep a stock that is losing money because they first thought it was good."},{"day":12,"bias":"Context neglect bias","summary":"You don't think about the bigger picture when making a decision.","example":"You look at one piece of information without thinking about where it came from."},{"day":13,"bias":"Contrast effect","summary":"Things look different depending on what you just saw.","example":"After seeing cheap items, a normal-priced item might seem expensive."},{"day":14,"bias":"Decoy effect","summary":"Adding a third, worse option can make you prefer one of the other two.","example":"When choosing popcorn sizes, a medium option that's almost as expensive as a large can make the large seem better."},{"day":15,"bias":"Default effect","summary":"You tend to stick with the option that is automatically chosen for you.","example":"Many people don't change the settings on their new phone."},{"day":16,"bias":"Triviality effect","summary":"People argue more about small, unimportant things.","example":"A group might spend a lot of time debating a minor detail in a plan."},{"day":17,"bias":"Denomination effect","summary":"You are less likely to spend larger bills than the same amount in smaller bills.","example":"You might break a $20 bill before you are willing to spend the money."},{"day":18,"bias":"Distinction bias","summary":"Things seem more different when you compare them side-by-side.","example":"When looking at two job offers together, you might focus on small differences."},{"day":19,"bias":"Disposition effect","summary":"Investors sell stocks that are winning but keep stocks that are losing.","example":"Someone might quickly sell a stock that made a little money but hold onto one that is losing money."},{"day":20,"bias":"Domain neglect bias","summary":"You focus on one detail and ignore the bigger picture.","example":"A manager might only look at how one team is doing and not the whole company."},{"day":21,"bias":"Dread aversion","summary":"You avoid things that make you feel very scared, even if they are safe.","example":"You might avoid flying even though it's safer than driving."},{"day":22,"bias":"Effort justification","summary":"You value things more if you put a lot of effort into them.","example":"You might think a piece of furniture you built is great even if it's not perfect."},{"day":23,"bias":"Empathy gap","summary":"You don't realize how much your feelings can change your future choices.","example":"You might say you won't eat a lot later when you are not hungry now."},{"day":24,"bias":"Endowment effect","summary":"You value things you own more than things you don't.","example":"You might want to sell your old toy for more money than you would pay for the same toy."},{"day":25,"bias":"Focusing effect","summary":"You put too much importance on one part of a situation.","example":"When thinking about moving to a sunny place, you might only think about the weather."},{"day":26,"bias":"Framing effect","summary":"The way information is presented changes how you see it.","example":"People are more likely to agree to a surgery with a '90% survival rate' than a '10% death rate.'"},{"day":27,"bias":"Functional fixedness","summary":"You can only see objects being used in their usual way.","example":"You might not realize you can use a coin as a screwdriver in an emergency."},{"day":28,"bias":"Fundamental pain bias","summary":"You think future pain will be worse than it really is.","example":"You might avoid a doctor's visit because you imagine the pain will be too bad."},{"day":29,"bias":"Goal gradients","summary":"You are more motivated when you are closer to your goal.","example":"You might work harder on a task when you see the finish line."},{"day":30,"bias":"Hot-cold empathy gap","summary":"You don't understand how your feelings will affect you in the future.","example":"You might make plans for when you are upset that you wouldn't actually do."},{"day":31,"bias":"Hyperbolic discounting","summary":"You prefer small rewards now over bigger rewards later.","example":"You might choose to get a small amount of money today instead of a larger amount next week."},{"day":32,"bias":"IKEA effect","summary":"You like things more if you helped make them.","example":"You might like a piece of furniture you built more than one you bought already made."},{"day":33,"bias":"Illusion of control","summary":"You think you have more control over things than you really do.","example":"You might think you can make a traffic light change by pressing the button many times."},{"day":34,"bias":"Impact bias","summary":"You think your feelings about future events will be stronger and last longer.","example":"You might think you will be very sad for a long time after something bad happens."},{"day":35,"bias":"Incentivization","summary":"Rewards can make you do things.","example":"A company might give bonuses to workers who do a good job."},{"day":36,"bias":"Interoceptive bias","summary":"Your body's feelings, like hunger, can affect your judgments.","example":"A judge might give a lighter sentence if they are not hungry."},{"day":37,"bias":"Irrational escalation","summary":"You keep putting more into something even when it's not working.","example":"You might keep spending money on a broken car to fix it even if it would be cheaper to buy a new one."},{"day":38,"bias":"Law of the instrument","summary":"You use the same tool for every problem.","example":"If you only have a hammer, you might try to fix everything by hammering."},{"day":39,"bias":"Less-is-better effect","summary":"You might prefer a smaller, better thing over a larger, worse thing when they are shown separately.","example":"You might pay more for a small scoop of great ice cream than a big scoop of okay ice cream if you see them alone."},{"day":40,"bias":"Limited attention","summary":"You can only focus on so much at once.","example":"You might miss something happening around you if you are focused on your phone."},{"day":41,"bias":"Loss aversion","summary":"You hate losing things more than you like gaining things.","example":"You might feel worse about losing $10 than you would feel good about finding $10."},{"day":42,"bias":"Motivating Uncertainty Effect","summary":"You are more excited by rewards when you don't know exactly what you will get.","example":"You might be more interested in a game with mystery prizes."},{"day":43,"bias":"Naïve allocation","summary":"You spread resources evenly instead of focusing on the best options.","example":"You might invest a little bit of money in many different things instead of the few best ones."},{"day":44,"bias":"Noble Edge Effect","summary":"You like brands that care about social issues.","example":"You might choose a coffee brand that is known for fair trade."},{"day":45,"bias":"Non-adaptive choice switching","summary":"You switch between choices even when it makes things worse.","example":"You might keep changing your mind about something even if it leads to bad results."},{"day":46,"bias":"Omission bias","summary":"You think doing something harmful is worse than not doing something that causes harm.","example":"You might feel worse about lying than about not telling the whole truth."},{"day":47,"bias":"Ostrich effect","summary":"You ignore bad news.","example":"An investor might avoid looking at their stocks when the market is down."},{"day":48,"bias":"Outcome bias","summary":"You judge a decision based on the result, not how good the decision was at the time.","example":"You might think a past decision was bad just because it had a bad outcome."},{"day":49,"bias":"Overjustification Effect","summary":"Rewards can make you like something less.","example":"A child who loves to draw might stop liking it if they get a reward every time."},{"day":50,"bias":"Risk compensation effect","summary":"Safety rules can make people take more risks.","example":"People might drive faster if they are wearing seatbelts."},{"day":51,"bias":"Placement bias","summary":"Where things are placed can affect what you choose.","example":"You are more likely to buy things that are at eye level in a store."},{"day":52,"bias":"Plan continuation bias","summary":"You stick to a plan even when it's clearly not working.","example":"A project might keep going even with problems because the team doesn't want to change the plan."},{"day":53,"bias":"Planning fallacy","summary":"You think tasks will take less time than they really will.","example":"You might always think you can finish a project faster than you actually can."},{"day":54,"bias":"Post-purchase rationalization","summary":"After buying something expensive, you ignore its flaws.","example":"After buying a fancy car, you might not want to admit it has problems."},{"day":55,"bias":"Present bias","summary":"You prefer rewards now over rewards in the future.","example":"You might choose to have fun now instead of saving for later."},{"day":56,"bias":"Prevention bias","summary":"You focus more on avoiding bad things than on making good things happen.","example":"A government might spend more money on stopping crime than on improving education."},{"day":57,"bias":"Prospect theory","summary":"You make choices based on potential gains and losses, and you dislike losses more.","example":"You might take a safe option to avoid losing money even if a riskier option could give you more."},{"day":58,"bias":"Pseudocertainty effect","summary":"You prefer choices that seem certain.","example":"You might prefer a discount that gives you a sure amount off over one with a chance of a bigger discount."},{"day":59,"bias":"Reactance","summary":"You do the opposite of what you are told if you feel forced.","example":"A child might do something they were told not to do just to show they can."},{"day":60,"bias":"Regret Aversion","summary":"You avoid making choices that could lead to regret.","example":"You might stick with a safe investment to avoid the chance of losing money."},{"day":61,"bias":"Restraint bias","summary":"You think you have more self-control than you actually do.","example":"Someone on a diet might think they can easily resist a treat."},{"day":62,"bias":"Salience bias","summary":"You focus on things that stand out and miss other important things.","example":"You might remember a news story with a strong image more than one with important facts."},{"day":63,"bias":"Second-Order Effect","summary":"You think about the direct results of actions but not the later results.","example":"A new invention might make things easier now but cause problems later."},{"day":64,"bias":"Sensory Appeal","summary":"Things that appeal to more of your senses are more engaging.","example":"Food that looks, smells, and tastes good is more enjoyable."},{"day":65,"bias":"Shaping","summary":"You learn complex things by starting with small steps.","example":"You might train a dog to do a trick by rewarding small steps towards the full trick."},{"day":66,"bias":"Status quo bias","summary":"You prefer things to stay the same.","example":"You might not want to switch to a new phone even if it's better."},{"day":67,"bias":"Streetlight effect","summary":"You look for things where it's easiest to see them.","example":"You might look for your keys under a streetlamp even if you didn't drop them there."},{"day":68,"bias":"Sunk cost fallacy","summary":"You keep doing something because you've already invested time or money in it.","example":"You might keep watching a bad movie because you already paid for it."},{"day":69,"bias":"Surrogation","summary":"You focus on an easy-to-measure number instead of the real thing you want to measure.","example":"Judging how good employees are just by how many hours they work."},{"day":70,"bias":"Temptation Bundling","summary":"You do something you should do by pairing it with something you want to do.","example":"You might only watch your favorite show while you are exercising."},{"day":71,"bias":"Time-saving bias","summary":"You underestimate how much time you save by going faster.","example":"You might not realize how little time you actually save by speeding."},{"day":72,"bias":"Unit bias","summary":"You want to finish a whole thing.","example":"You might feel like you have to eat everything on your plate."},{"day":73,"bias":"Proportional perception law","summary":"How much something changes needs to be big enough for you to notice.","example":"You might not notice a small change in the weight of something light."},{"day":74,"bias":"Zero-risk bias","summary":"You prefer to get rid of a small risk completely over reducing a bigger risk.","example":"You might spend a lot of time on a very small safety issue instead of a bigger one."},{"day":75,"bias":"Zero-sum bias","summary":"You think if one person gains something, someone else must lose.","example":"In a negotiation, you might think if the other person gets a good deal, you got a bad one."},{"day":76,"bias":"Bandwagon effect","summary":"You do things because other people are doing them.","example":"You might like a song just because it's popular."},{"day":77,"bias":"Actor-observer bias","summary":"You blame your actions on outside things but blame others' actions on their personality.","example":"You say you were late because of traffic, but your friend was late because they are not on time."},{"day":78,"bias":"Anthropomorphism","summary":"You give human traits to things that are not human.","example":"You talk to your pet like it understands everything you say."},{"day":79,"bias":"Assumed similarity bias","summary":"You think other people are like you.","example":"If you like a certain hobby, you might think most people like it too."},{"day":80,"bias":"Authority bias","summary":"You believe someone more if they seem like an expert, even if they are not.","example":"You might believe a famous person's opinion on something they don't really know about."},{"day":81,"bias":"Favor-liking effect","summary":"You like someone more after doing them a favor.","example":"You might start to like a coworker more after helping them with a task."},{"day":82,"bias":"Bias blind spot","summary":"You think you are less biased than other people.","example":"You might see other people's biases but not your own."},{"day":83,"bias":"Cheerleader effect","summary":"People look better in a group than alone.","example":"A person in a group photo might seem more attractive."},{"day":84,"bias":"Compassion fade","summary":"You feel less empathy for many people in need than for one person.","example":"You might be less likely to donate to a large group than to help one person."},{"day":85,"bias":"Courtesy bias","summary":"You say what you think others want to hear.","example":"You might agree with a group even if you don't really."},{"day":86,"bias":"Cross-race effect","summary":"You have trouble telling faces of other races apart.","example":"It might be harder for you to recognize people of a different race."},{"day":87,"bias":"Curse of knowledge","summary":"Experts think everyone knows what they know.","example":"A teacher might forget what it's like to not understand a basic concept."},{"day":88,"bias":"Defensive attribution hypothesis","summary":"You blame victims for bad things that happen to them so you feel safer.","example":"If someone gets robbed, you might think they were careless."},{"day":89,"bias":"Overconfidence of beginners","summary":"People who are bad at something think they are good, and experts doubt themselves.","example":"Someone who doesn't know much about a topic might act like they are an expert."},{"day":90,"bias":"Egocentric bias","summary":"You think your own views are the most important.","example":"You might think everyone sees the world the same way you do."},{"day":91,"bias":"Extrinsic incentives bias","summary":"You think others do things for rewards, but you do them because you like to.","example":"You might think a coworker is only working hard for a promotion."},{"day":92,"bias":"False consensus effect","summary":"You think more people agree with you than they actually do.","example":"If you like a certain TV show, you might think most of your friends like it too."},{"day":93,"bias":"False uniqueness bias","summary":"You think your skills and projects are more special than they are.","example":"You might think your ideas are very original."},{"day":94,"bias":"Fundamental attribution error","summary":"You blame people's personality for their actions and not the situation.","example":"If someone cuts you off in traffic, you might think they are a bad person."},{"day":95,"bias":"Gender bias","summary":"You have unfair beliefs about people based on their gender.","example":"You might assume a nurse is a woman and a doctor is a man."},{"day":96,"bias":"Group attribution error","summary":"You think one person's traits in a group apply to the whole group.","example":"You might think everyone in a certain club is the same way as one member you met."},{"day":97,"bias":"Groupthink","summary":"A group makes bad decisions because they want to agree with each other.","example":"A team might go along with a bad idea to avoid arguments."},{"day":98,"bias":"Groupshift","summary":"Group discussions can make people's opinions more extreme.","example":"After talking about something, a group might have stronger opinions than they did at first."},{"day":99,"bias":"Halo effect","summary":"If you like one thing about someone, you'll like everything about them.","example":"You might think a good-looking person is also smart and kind."},{"day":100,"bias":"Identifiable victim effect","summary":"You are more likely to help one person you can see than a large group.","example":"People often donate more to help one sick child than to a large charity."},{"day":101,"bias":"Illusion of asymmetric insight","summary":"You think you know others better than they know you.","example":"You might think you understand your friend's reasons better than they do."},{"day":102,"bias":"Illusion of transparency","summary":"You think others know what you are feeling.","example":"You might think people can tell you are nervous even if you are hiding it well."},{"day":103,"bias":"Illusory superiority","summary":"You think you are better than average.","example":"You might think you are a better driver than most people."},{"day":104,"bias":"Implicit association","summary":"You have unconscious connections between ideas.","example":"You might unconsciously link certain groups of people with certain jobs."},{"day":105,"bias":"Implicit stereotypes","summary":"You have unconscious beliefs about groups of people.","example":"You might unconsciously think that people from a certain place are all the same."},{"day":106,"bias":"Impostor syndrome","summary":"You doubt your success and fear being seen as a fake.","example":"You might feel like you are not good enough even though you are successful."},{"day":107,"bias":"In-group bias","summary":"You favor people who are in your own group.","example":"You might be nicer to people who like the same sports team as you."},{"day":108,"bias":"Intentionality bias","summary":"You think people's actions are on purpose rather than accidents.","example":"If someone bumps into you, you might think they did it on purpose."},{"day":109,"bias":"Messenger effect","summary":"You believe a message more if you like or trust the person telling it.","example":"You might trust health advice from a doctor you like."},{"day":110,"bias":"Moral credential effect","summary":"After doing something good, you might feel like you can do something bad.","example":"Someone who donates to charity might then feel okay about being a little selfish."},{"day":111,"bias":"Moral luck","summary":"You are judged for things you can't control.","example":"Someone might be praised for saving someone in a flood even if it was mostly luck."},{"day":112,"bias":"Naïve cynicism","summary":"You think others are more selfish than they really are.","example":"You might think people only help others because they want something in return."},{"day":113,"bias":"Naïve realism","summary":"You think you see the world as it really is and that others are wrong if they disagree.","example":"You might think your political views are just the facts."},{"day":114,"bias":"Not invented here","summary":"You don't want to use ideas or products from outside your own group.","example":"A company might not want to use a good idea from another company."},{"day":115,"bias":"Observer effect","summary":"People act differently when they know they are being watched.","example":"Students might do better on a test if they know someone is watching."},{"day":116,"bias":"Out-group homogeneity bias","summary":"You think people in other groups are all the same.","example":"You might think everyone from another country is alike."},{"day":117,"bias":"Outgroup favoritism","summary":"You favor people who are not in your own group.","example":"You might think people from a more famous school are better than people from your school."},{"day":118,"bias":"Pluralistic Ignorance","summary":"You think your private beliefs are different from what most people publicly say.","example":"Students might not ask questions in class even if they are confused because they think everyone else understands."},{"day":119,"bias":"Prejudice","summary":"You have a negative opinion about someone without a good reason.","example":"You might dislike someone just because they are from a certain group."},{"day":120,"bias":"Projection bias","summary":"You think others have the same beliefs and feelings as you do.","example":"If you love a certain food, you might think everyone else loves it too."},{"day":121,"bias":"Expectation effect on performance","summary":"Higher expectations can lead to better performance.","example":"Teachers who think certain students are smart might help them do better."},{"day":122,"bias":"Reactive devaluation","summary":"You dislike ideas just because they come from someone you don't like.","example":"You might reject a suggestion just because it came from someone you disagree with."},{"day":123,"bias":"Response Bias","summary":"You answer questions in a way that makes you look good.","example":"You might say you eat healthier than you really do on a survey."},{"day":124,"bias":"Reverse psychology","summary":"You say the opposite of what you want someone to do so they will do what you want.","example":"You might tell a child 'Don't eat all your vegetables!' hoping they will."},{"day":125,"bias":"Self-cry bias","summary":"You see yourself as a victim more easily than as someone who causes problems.","example":"In an argument, you might focus on how you were hurt more than your own actions."},{"day":126,"bias":"Self-serving bias","summary":"You blame your failures on o
