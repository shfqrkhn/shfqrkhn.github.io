*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--t1)/1.6 var(--serif);-webkit-tap-highlight-color:transparent;font-variant-numeric:lining-nums}
::selection{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3,p,ul,dl,dd,table{margin:0;padding:0}
ul{list-style:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{max-width:76rem;margin:0 auto;padding:var(--s5) clamp(16px,4vw,40px) var(--s6)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:var(--s2) var(--s3);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r0);cursor:pointer;font-size:var(--t0);line-height:1.2;transition:background-color .15s ease-out,color .15s ease-out}
.btn:hover{background:var(--bg)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;font-size:var(--t1);padding:var(--s2) var(--s4)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;border-color:transparent;padding-left:0;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--bg)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.link{background:none;border:0;min-height:44px;min-width:44px;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;color:var(--ink)}
.link:hover{text-decoration-thickness:2px}
.fade{animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* index: contents page */
.index{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s5)}
.index h1{font:700 var(--t4)/1 var(--serif);letter-spacing:-.02em;text-wrap:balance;margin-bottom:var(--s4);overflow-wrap:anywhere}
.index>*,.game>*,.doc>*{min-width:0}
.intro{max-width:30rem;color:var(--muted);margin-bottom:var(--s4)}
.field label{display:block;font-size:var(--t0);margin-bottom:var(--s2)}
.search{display:flex;align-items:center;gap:var(--s2);min-height:48px;padding:0 var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--r0)}
.search:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.search input{flex:1;min-width:0;min-height:44px;background:none;border:0;outline:0;font-size:var(--t1)}
.search input::placeholder{color:var(--muted);opacity:1}
.filters{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.part-head{font:600 var(--t2)/1.2 var(--cond);margin:var(--s5) 0 var(--s2);padding-bottom:var(--s2);border-bottom:2px solid var(--ink)}
.contents section:first-of-type .part-head{margin-top:0}
.count{color:var(--muted);font-weight:400}
.row{width:100%;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 var(--s3);min-height:64px;padding:var(--s3) 0;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left;cursor:pointer}
.row:hover .row-title{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.row-title{font-size:var(--t2);font-weight:700;line-height:1.25}
.row-meta{grid-column:1/-1;font:600 var(--t1)/1.3 var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}
.shelf-tag{display:inline-flex;align-items:center;gap:var(--s1);font:600 var(--t1)/1 var(--cond)}
.empty{padding:var(--s4) 0;display:grid;gap:var(--s3);justify-items:start}
/* game page */
.game{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4)}
.margin .btn.quiet{margin-bottom:var(--s3)}
.chapter-nav{margin-bottom:var(--s3)}
.nav-title{font:600 var(--t1)/1 var(--cond);color:var(--muted);margin-bottom:var(--s2)}
.chapter-nav ul{display:flex;flex-wrap:wrap;gap:0 var(--s4)}
.part{font:600 var(--t2)/1 var(--cond);color:var(--muted);margin-bottom:var(--s2)}
.text h1{font:700 var(--t4)/1 var(--serif);letter-spacing:-.02em;text-wrap:balance;margin-bottom:var(--s4);overflow-wrap:anywhere}
.lead{font-size:var(--t2);line-height:1.45;max-width:36rem;margin-bottom:var(--s4);text-wrap:pretty}
.facts{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-bottom:var(--s4);font-variant-numeric:tabular-nums}
.facts dt{font:600 var(--t1)/1.2 var(--cond);color:var(--muted)}
.facts dd{font-size:var(--t2);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.chapter{margin-top:var(--s6);scroll-margin-top:var(--s4);max-width:38rem}
.chapter-head{display:flex;align-items:baseline;gap:var(--s3);font:700 var(--t3)/1.1 var(--serif);margin-bottom:var(--s4);padding-bottom:var(--s2);border-bottom:2px solid var(--ink);text-wrap:balance}
.chapter-n{font:600 var(--t3)/1 var(--cond);color:var(--muted);min-width:1ch}
.prose,.muted,.notice,.chapter-head span{overflow-wrap:anywhere}
.prose{max-width:62ch;text-wrap:pretty}
.pre{white-space:pre-line}
.sub{margin-top:var(--s5)}
.sub:first-child{margin-top:0}
.sub h3{font:600 var(--t2)/1.2 var(--cond);margin-bottom:var(--s2)}
.mistakes{display:grid;gap:var(--s3);padding-left:1.25rem;list-style:disc}
.mistakes li::marker{color:var(--muted)}
.scale{display:grid;gap:var(--s3)}
.scale div{display:grid;gap:var(--s1);padding-bottom:var(--s3);border-bottom:1px solid var(--rule)}
.scale dt{font:600 var(--t2)/1.2 var(--cond)}
.seal{background:var(--surface);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:var(--s4) var(--s3);display:grid;gap:var(--s3);justify-items:start}
.seal-title{font-size:var(--t2);font-weight:700;line-height:1.3}
.formula{font-variant-numeric:tabular-nums;background:var(--surface);padding:0 var(--s1);border-radius:var(--r0);border:1px solid var(--rule)}
.mx-1{margin-inline:.2em}
.highlight{font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px;text-decoration-thickness:1px}
/* help and licences */
.doc{max-width:40rem;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4);justify-items:start}
.doc h1{font:700 var(--t4)/1 var(--serif);letter-spacing:-.02em;overflow-wrap:anywhere;max-width:100%}
.doc h2{font:600 var(--t2)/1.2 var(--cond);margin-bottom:var(--s2)}
.doc section{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);justify-items:start;margin-top:var(--s3)}
.notice{padding:var(--s3);background:var(--surface);border-top:2px solid var(--warning);border-bottom:2px solid var(--warning)}
.muted{color:var(--muted);font-size:var(--t0)}
.lic-wrap{width:100%;max-width:100%;overflow-x:auto}
.lic{border-collapse:collapse;width:100%;font-size:var(--t0)}
.lic th,.lic td{overflow-wrap:break-word;text-align:left;padding:var(--s2) var(--s3) var(--s2) 0;border-bottom:1px solid var(--rule);vertical-align:top}
.lic th{font:600 var(--t1)/1.2 var(--cond);color:var(--muted)}
.licence{white-space:pre-wrap;overflow-wrap:anywhere;font:400 var(--t0)/1.5 var(--serif);background:var(--surface);padding:var(--s3);margin:0;max-width:100%}
/* footer */
.foot{border-top:1px solid var(--rule);padding:var(--s4) clamp(16px,4vw,40px) var(--s5);font-size:var(--t0);color:var(--muted)}
.foot>div{max-width:76rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);align-items:center}
.foot .link{color:var(--ink);min-height:44px}
@media (min-width:56rem){
  .index{grid-template-columns:19rem minmax(0,1fr);gap:var(--s6);align-items:start}
  .index .margin{position:sticky;top:var(--s4)}
  .index h1{font-size:var(--t3);margin-bottom:var(--s3)}
  .game{grid-template-columns:15rem minmax(0,1fr);gap:var(--s6);align-items:start}
  .game .margin{position:sticky;top:var(--s4)}
  .chapter-nav ul{display:grid;gap:0}
  .row{grid-template-columns:1fr auto auto}
  .row-meta{grid-column:auto}
  .chapter-head{font-size:var(--t3)}
}
.statusbar{position:sticky;bottom:var(--s3);display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);margin-top:var(--s4);padding:var(--s2) var(--s3);background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r0);max-width:62ch;overflow-wrap:anywhere}
.statusbar .btn.quiet{padding-left:var(--s2)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
main:focus{outline:none}
.filein{display:none}
.import-preview{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);padding:var(--s3);border:1px solid var(--line);background:var(--surface);max-width:62ch}
.import-preview h3{font:600 var(--t2)/1.2 var(--cond)}
.import-preview ul{list-style:none;padding:0;margin:0;display:grid;gap:var(--s2)}
.foot a.link{display:inline-flex;align-items:center}
.thin{margin-top:var(--s3);max-width:62ch}
.recov{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);justify-items:start;margin-bottom:var(--s4)}
.shelf-tools{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s3);justify-items:start;margin-bottom:var(--s5);padding-bottom:var(--s4);border-bottom:2px solid var(--ink)}
.shelf-tools+section .part-head{margin-top:0}
@media print{
@page{margin:14mm}
html[data-theme]{--bg:var(--print-paper);--surface:var(--print-paper);--ink:var(--print-ink);--muted:var(--print-grey);--line:var(--print-line);--rule:var(--print-rule);--accent:var(--print-ink);--accent-ink:var(--print-paper)}
html,body{background:var(--print-paper);color:var(--print-ink)}
body{font-size:var(--p-body);line-height:1.4}
.skip,.omn-bar,.foot,.statusbar,.margin .btn,.actions,.filters,.field,.chapter-nav,.seal .btn,.shelf-tools,.import-preview,.empty .btn,.doc>.btn,.doc>p>.link{display:none!important}
main{max-width:none;padding:0}
.index,.game{display:block}
.index .margin,.game .margin{position:static}
.fade{animation:none}
h1,.index h1,.text h1,.doc h1{font-size:var(--p-h1);margin-bottom:6pt}
.intro,.lead{font-size:var(--p-body);margin-bottom:8pt}
.part,.nav-title{font-size:var(--p-body)}
.facts{gap:4pt 18pt;margin-bottom:8pt}
.facts dd{font-size:var(--p-lead)}
.part-head{font-size:var(--p-h2);margin:12pt 0 4pt;break-after:avoid}
.row{min-height:0;padding:3pt 0;break-inside:avoid;display:grid;grid-template-columns:1fr auto auto}
.row-title{font-size:var(--p-body)}
.row-meta{font-size:var(--p-small);grid-column:auto}
.chapter{margin-top:12pt;max-width:none;break-inside:avoid}
.chapter-head{font-size:var(--p-h2);margin-bottom:6pt;break-after:avoid}
.chapter-n{font-size:var(--p-h2)}
.scale div{padding-bottom:4pt}
.scale dt,.sub h3{font-size:var(--p-body)}
.seal{padding:6pt 0;border-color:var(--print-ink)}
.seal-title{font-size:var(--p-body)}
#strategy-body>.btn,.recov{display:none!important}
.lic-wrap{overflow:visible}
.doc{max-width:none}
.doc h2{font-size:var(--p-h3)}
.notice{border-color:var(--print-ink)}
.licence{font-size:var(--p-fine);padding:0;white-space:pre-wrap}
}

{
 "dataVersion": 1,
 "date": "2026-10-31",
 "source": "Written for MeepleMentor; content as shipped in version 14.5.3. No publisher text is copied. Ten games have short chapters (listed in thinGames); check the publisher's rulebook for full rules.",
 "thinGames": [
  "sw",
  "sg",

 ],
 "games": [
  {
   "id": "7w",
   "name": "7 Wonders",
   "weight": 2.3,
   "time": "\u003c30m",
   "type": "Technical",
   "cat": "Drafting",
   "orientation": {
    "hook": "Civilization building is a lie. This is a resource starvation engine.",
    "victory": "VP Sum. **Science ($n^2$)** is for math-savants. **Civilian (Blue)** is for consistent winners. Specialization beats generalization every time.",
    "directive": "**The Parasitic Economy.** Do not build what you need; build what your *neighbors* need. If you produce the only Brick, they must pay you. Use their money to buy what you lack. If a card helps your neighbor more than you, bury it under your Wonder.",
    "finisher": "**The Age III Cliff.** Costs skyrocket. If you lack a 'Free Chain' (e.g. Scriptorium to Library) or 10+ coins by Age III, you are dead."
   },
   "tactics": {
    "opener": "**Turn 1:** Inspect neighbors. Draft the raw material (Gray/Brown) that is SCARCE in their starting cities. Force dependency immediately.",
    "mistakes": [
     "**The Hoarder:** Building a resource you can buy for 1 coin. Waste of a turn.",
     "**Science Dabbler:** Going Green without committing to 3+ sets. It's exponential or nothing.",
     "**Peacekeeper:** Taking a -1 token ($0 pts$) is better than wasting 3 turns on shields to tie. Lose the war, win the bank."
    ],
    "synergy": "**Vineyard/Haven:** Turns neighbor assets into your gold.\n\n**Scientists Guild:** The wildcard that squares your score.",
    "setup": "Sit to the **left** of a Military player; they ignore resources, passing them to you."
   },
   "intel": {
    "scaling": "3-4P: **Hate Drafting.** Block aggressively. // 5-7P: **Solitaire.** Focus on self-sufficiency.",
    "meta": "**Chain Memory:** Memorize the links. Altar, then Temple, then Pantheon. Save your resources."
   }
  },
  {
   "id": "7wd",
   "name": "7 Wonders Duel",
   "weight": 2.2,
   "time": "30m",
   "type": "Technical",
   "cat": "Duel",
   "orientation": {
    "hook": "A knife-fight in a phone booth. Zero-sum resource denial.",
    "victory": "**Civilian**, **Military (Instant)**, **Science (Instant)**. Threaten instant wins to force bad plays.",
    "directive": "**Control the Reveal.** Never draft a card that flips a good card for your opponent. Use 'Repeat Turn' Wonders to take a card, reveal the next, and take that too.",
    "finisher": "**The Red/Green Clock.** If opponent hits the penultimate Military slot, you *must* draft Red. Force them to waste turns defending."
   },
   "tactics": {
    "opener": "**Turn 1:** Draft a card that does NOT reveal a face-down card. Force your opponent to open the board for you.",
    "mistakes": [
     "**Wonder Hoarding:** Delaying your 4th Wonder. You lose the slot if they build 4 first.",
     "**Gold Starvation:** Without Yellow, monopolies will bankrupt you ($4+ per resource).",
     "**Blind Reveal:** Uncovering a game-winning card for the enemy."
    ],
    "synergy": "**The Sphinx:** Extra turn. The best Wonder in the game.\n\n**Yellow Monopoly:** Hoard Brown/Grey cards to starve their economy.",
    "setup": "Player 2 should draft **Great Library** or **Pyramids**."
   },
   "intel": {
    "scaling": "Strictly 2P. Economy is closed.",
    "meta": "**Law Token:** The Scientific symbol for 'Law' is the key to victory."
   }
  },
  {
   "id": "az",
   "name": "Azul",
   "weight": 1.8,
   "time": "45m",
   "type": "Psychological",
   "cat": "Abstract",
   "orientation": {
    "hook": "A game of chicken. You aren't filling walls; you're overflowing their floor.",
    "victory": "Adjacency + Verticals ($7pt$) + Colors ($10pt$). Game ends on Horizontal.",
    "directive": "**Weaponize the Floor.** Calculate the tile count. Force the last player to take a massive pile of a single color. This **'Tile Bomb'** is a -14 point swing.",
    "finisher": "**The Stall.** If behind, force the game to continue. Build verticals (7pts). If ahead, rush the top row (5 tiles) to kill the game."
   },
   "tactics": {
    "opener": "**Turn 1:** Take the -1 token IF it secures a massive color group or forces a -4 penalty on the opponent.",
    "mistakes": [
     "**Fear of -1:** The First Player token is the most powerful tile. Take it.",
     "**Top-Down:** Fill hard rows (4/5) early. Easy rows (1/2) fill with garbage later.",
     "**Ignoring Verticals:** 7 points per column is the real score."
    ],
    "synergy": "**Adjacency Chaining:** Place tiles touching existing ones for double scoring.",
    "setup": "Use **Grey Side** for competitive play."
   },
   "intel": {
    "scaling": "2P: **Zero-Sum.** Hate-drafting is mandatory. // 3-4P: **Chaos.** Defend yourself.",
    "meta": "**Color Lock:** Finishing a row locks that color out. Predict the draft."
   }
  },
  {
   "id": "ca",
   "name": "Carcassonne",
   "weight": 2,
   "time": "45m",
   "type": "Social",
   "cat": "Area Control",
   "orientation": {
    "hook": "Hostile takeover warfare disguised as map building.",
    "victory": "Points. **Farmers (Fields)** are the nuclear option.",
    "directive": "**Parasitic Integration.** Don't build; invade. Place a tile near a big city, add a meeple, then connect them later to steal the points. If you have majority, you take **everything**.",
    "finisher": "**The Scavenger.** Last 10 tiles: Stop building. Only complete tiny 2-tile features for quick points."
   },
   "tactics": {
    "opener": "**Turn 1-5:** Build small. Retrieve meeples. Do not commit to a Farm until a city of 6+ points exists.",
    "mistakes": [
     "**Cathedral Trap:** Putting a Cathedral in your own city risks scoring 0. Put it in an *opponent's* city to poison it.",
     "**Meeple Exhaustion:** Always keep 1 meeple in reserve.",
     "**Farmer Neglect:** A central field is worth 30 points. Die for it."
    ],
    "synergy": "**Big Meeple:** Counts as 2. Use it to steal shared cities.",
    "setup": "Count the tiles. Know the caps."
   },
   "intel": {
    "scaling": "2P: **Hostile.** Steal everything. // 3-5P: **Diplomatic.** Share points.",
    "meta": "**Stranding:** Trap opponent meeples in impossible features."
   }
  },
  {
   "id": "ch",
   "name": "Chess",
   "weight": 3.7,
   "time": "Var",
   "type": "Technical",
   "cat": "Abstract",
   "orientation": {
    "hook": "The eternal game of perfect information. Pure calculation.",
    "victory": "**Checkmate.** Remove the King's reality.",
    "directive": "**Control the Center.** Squares d4, e4, d5, e5 are the high ground. Occupy them.",
    "finisher": "**The End Game.** King becomes an active fighting piece. Push passed pawns."
   },
   "tactics": {
    "opener": "**Turn 1:** White: e4/d4. Black: e5/c5. Contest the center immediately.",
    "mistakes": [
     "**Early Queen:** She gets chased by minor pieces, wasting tempo.",
     "**Blunder Check:** Look at every piece. Is it hanging?",
     "**King Safety:** Castle by move 10."
    ],
    "synergy": "**The Battery:** Rooks doubled on a file.",
    "setup": "Place the board so each player has a light square in the right-hand corner. Each queen starts on her own colour: the white queen on a light square, the black queen on a dark square. From White's side, the king stands to the right of the queen."
   },
   "intel": {
    "scaling": "2 players",
    "meta": "**Space:** A cramped position is death. Trade pieces to breathe."
   }
  },
  {
   "id": "cl",
   "name": "Clank!",
   "weight": 2.2,
   "time": "60m",
   "type": "Technical",
   "cat": "Deck Building",
   "orientation": {
    "hook": "Not a dungeon crawler; an efficiency engine. Exploration without profit is failure.",
    "victory": "Max Win Equity (VP + Assets) via Probability Management.",
    "directive": "**Velocity is Safety.** The 'Rusher' dictates the timeline. If you can't match their speed, you must exceed their efficiency immediately. Target 50% deck density for Movement (Boots).",
    "finisher": "**The Hover.** Move to the final exit square but *do not exit*. Farm points until an opponent is mathematically likely to die. Exert maximum pressure."
   },
   "tactics": {
    "opener": "**Turn 1-4:** Buy +2/+3 Skill cards. You must reach **7 Skill** (Tomes/Master Key) quickly. Ignore cheap cards that don't cycle.",
    "mistakes": [
     "**The Crown Trap:** Buying high-cost, 0-utility items early. It clogs the deck.",
     "**Deep Dive Suicide:** Entering \u003c30 VP zones with \u003c3 Health.",
     "**Hoarding Swords:** You only need 2 swords per shuffle. Don't overbuy."
    ],
    "synergy": "**Teleport vs Crystal Caves:** Teleport cards bypass 'Stop' rooms.\n\n**The Hate Draft:** Buy a cheap Boot card just to strand an opponent in the deep.",
    "setup": "**Market Positioning:** Buy items (Keys/Backpack) on your *descent*, never your ascent."
   },
   "intel": {
    "scaling": "Base: Speed is king. // Legacy: Extraction \u0026 Franchise Board \u003e Game Win.",
    "meta": "**Cycle Tax:** Spend extra skill to flush the market row if it stagnates."
   }
  },
  {
   "id": "co",
   "name": "Coup",
   "weight": 1.4,
   "time": "15m",
   "type": "Social",
   "cat": "Bluffing",
   "orientation": {
    "hook": "Poker with bullets. Lying is a resource.",
    "victory": "Last player breathing.",
    "directive": "**Information Liquidity.** Money is good; Information (Inquisitor) is better. Bluff early to build 'truth equity'.",
    "finisher": "**The 10 Coin Cap.** You MUST Coup at 10. Spend before you become a loot pinata."
   },
   "tactics": {
    "opener": "**Turn 1:** Claim Duke. Take 3 coins. Even if you don't have it. If challenged, you lose a life but gain crucial intel on table aggression.",
    "mistakes": [
     "**Silent Duke:** Allowing free money ruins the economy. Challenge.",
     "**Blind Assassin:** If blocked, you lose 3 coins. Coup is safer.",
     "**Static Faction:** Switch teams to avoid targeting."
    ],
    "synergy": "**The Pivot:** Claim Duke. If caught, claim Captain next. Confuses the read.",
    "setup": "Reformation: Deal Allegiances."
   },
   "intel": {
    "scaling": "3-4P: **Tactical.** // 5-6P: **Faction War.**",
    "meta": "**Inquisitor:** Known cards cannot be bluffed."
   }
  },
  {
   "id": "dm",
   "name": "Dominion",
   "weight": 2.4,
   "time": "30m",
   "type": "Technical",
   "cat": "Deck Building",
   "orientation": {
    "hook": "Your deck is an engine; trash the parts that don't work.",
    "victory": "Most VP when piles empty.",
    "directive": "**Trash is Treasure.** Destroy Coppers/Estates (Chapel). A 5-card deck plays its best combo every turn.",
    "finisher": "**Green or Gold.** If the engine stalls, buy Gold and Provinces. Don't be cute."
   },
   "tactics": {
    "opener": "**Turn 1/2:** Buy Silver ($3) or Trasher (Chapel). NEVER buy Estate.",
    "mistakes": [
     "**Village Idiot:** +Action without +Draw.",
     "**Green Bloat:** Buying VP too early clog the engine.",
     "**Mid-Game Copper:** Never buy Copper. It dilutes the signal."
    ],
    "synergy": "**Village + Smithy:** The infinite loop.",
    "setup": "Check Kingdom for Trashing."
   },
   "intel": {
    "scaling": "2P: **Strategic.** // 4P: **Rush.**",
    "meta": "**3-Pile End:** Watch the low piles."
   }
  },
  {
   "id": "ek",
   "name": "Exploding Kittens",
   "weight": 1.1,
   "time": "15m",
   "type": "Psychological",
   "cat": "Party",
   "orientation": {
    "hook": "Russian Roulette. Hand management is life.",
    "victory": "Survival.",
    "directive": "**Hoard.** Cards are armor. Collect everything. Do not play cards unless you are dying.",
    "finisher": "**The Red Zone.** Last 10 cards. Dump attacks to force opponents to draw."
   },
   "tactics": {
    "opener": "**Turn 1:** Play nothing. Draw. Build a hand \u003e 5.",
    "mistakes": [
     "**Wasting Defuses:** Never play a Defuse unless forced.",
     "**Blind Placement:** Put kitten 2-3 cards down, not top.",
     "**Premature Aggression:** Don't attack when deck is safe."
    ],
    "synergy": "**See Future + Attack:** The kill shot.",
    "setup": "Kittens = Players - 1."
   },
   "intel": {
    "scaling": "5P: **Chaos.**",
    "meta": "**Nope War:** Save a Nope for a Nope."
   }
  },
  {
   "id": "ka",
   "name": "Kahuna",
   "weight": 2,
   "time": "30m",
   "type": "Technical",
